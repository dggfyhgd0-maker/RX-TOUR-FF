  window.onAdminModeChange = function(ctxKey, modeSelectId, totalInputId) {
    var selEl = document.getElementById(modeSelectId);
    if (!selEl) return;
    var newMode = selEl.value;
    var prevList = syncPrizeDraftFromDom(ctxKey);
    if (!ui.prizeDrafts) ui.prizeDrafts = {};
    if (!ui.prizeDraftMode) ui.prizeDraftMode = {};
    ui.prizeDraftMode[ctxKey] = newMode;
    var fixedCfg = getFixedPrizeModeConfig(newMode);
    if (fixedCfg) {
      ui.prizeDrafts[ctxKey] = buildFixedDraftRows(fixedCfg, prevList, ctxKey === "create");
    } else {
      ui.prizeDrafts[ctxKey] = prevList.slice();
    }
    var boxEl = document.getElementById("prizePoolBox_" + ctxKey);
    if (boxEl) boxEl.innerHTML = renderPrizePoolSettingsInner(ctxKey, totalInputId, newMode);
  };

  window.syncPrizeDraftField = function(ctxKey, idx, field, val) {
    var list = getPrizeDraftList(ctxKey);
    if (!list[idx]) return;
    if (field === "amount") list[idx].amount = Number(val || 0);
    else list[idx].rank = String(val || "");
  };

  window.addPrizeDraftRow = function(ctxKey, totalInputId) {
    var activeMode = (ui.prizeDraftMode && ui.prizeDraftMode[ctxKey]) || "";
    if (getFixedPrizeModeConfig(activeMode)) return;
    var list = syncPrizeDraftFromDom(ctxKey);
    list.push({ rank: defaultPrizeRankLabel(list.length), amount: 0 });
    var wrap = document.getElementById("prizeRowsWrap_" + ctxKey);
    if (wrap) wrap.innerHTML = renderPrizeRowsHtml(ctxKey, totalInputId, activeMode);
  };

  window.removePrizeDraftRow = function(ctxKey, idx, totalInputId) {
    var activeMode = (ui.prizeDraftMode && ui.prizeDraftMode[ctxKey]) || "";
    if (getFixedPrizeModeConfig(activeMode)) return;
    var list = syncPrizeDraftFromDom(ctxKey);
    list.splice(idx, 1);
    var wrap = document.getElementById("prizeRowsWrap_" + ctxKey);
    if (wrap) wrap.innerHTML = renderPrizeRowsHtml(ctxKey, totalInputId, activeMode);
  };

  window.autoCalcPrizeTotal = function(ctxKey, totalInputId) {
    var list = syncPrizeDraftFromDom(ctxKey);
    var sum = list.reduce(function(acc, item) { return acc + Math.max(0, Number(item.amount || 0)); }, 0);
    var totalEl = document.getElementById(totalInputId);
    if (totalEl) totalEl.value = String(sum);
    showToast("Total Prize Pool calculated: ৳" + formatMoney(sum), "info");
  };

  function buildValidatedPrizeArray(ctxKey, modeId) {
    var activeMode = modeId || (ui.prizeDraftMode && ui.prizeDraftMode[ctxKey]) || "";
    var fixedCfg = getFixedPrizeModeConfig(activeMode);
    var list = syncPrizeDraftFromDom(ctxKey);
    if (fixedCfg) {
      var fixedOut = [];
      for (var i = 0; i < fixedCfg.count; i++) {
        var amtVal = list[i] ? Math.max(0, Number(list[i].amount || 0)) : 0;
        fixedOut.push({ rank: fixedRankLabel(i), amount: amtVal });
      }
      return fixedOut;
    }
    var out = [];
    list.forEach(function(item) {
      var rank = String(item.rank || "").trim();
      var amt = Math.max(0, Number(item.amount || 0));
      if (rank && amt > 0) {
        out.push({ rank: rank, amount: amt });
      }
    });
    return out;
  }

  // ==================== ADMIN RULES MANAGEMENT ====================
  function getRulesTargetInfo(targetKey) {
    var key = String(targetKey || "mode:BR Match");
    if (key.indexOf("match:") === 0) {
      var mid = key.slice(6);
      var m = state.matches.find(function(x) { return x.id === mid; });
      if (m) {
        var info = getEffectiveMatchRules(m);
        return { type: "match", match: m, label: getDynamicMatchTitle(m) + " (" + m.map + ")", isCustom: info.scope === "match", rules: info.rules.slice() };
      }
    }
    var modeId = key.indexOf("mode:") === 0 ? key.slice(5) : "BR Match";
    var modeMap = state.modeRules || createDefaultModeRules();
    var modeRules = Array.isArray(modeMap[modeId]) ? modeMap[modeId] : [];
    return { type: "mode", modeId: modeId, label: getModeMeta(modeId).name + " (Mode Default)", isCustom: false, rules: modeRules.slice() };
  }

  function renderAdminRulesListHtml(ctxKey) {
    var list = (ui.rulesDrafts && Array.isArray(ui.rulesDrafts[ctxKey])) ? ui.rulesDrafts[ctxKey] : [];
    if (list.length === 0) {
      return '<div style="font-size:12.5px;color:var(--text-3);padding:8px 0;">No rules set yet. Add a rule below.</div>';
    }
    return list.map(function(txt, idx) {
      return '<div class="prize-editor-row" style="grid-template-columns:28px minmax(0,1fr) 40px;align-items:center;">' +
        '<div class="rule-num-badge">' + (idx + 1) + '</div>' +
        '<input id="ruleInput_' + ctxKey + '_' + idx + '" class="field-input" style="min-height:44px;font-size:13px;" type="text" dir="auto" value="' + escapeHtml(txt) + '" placeholder="Enter rule text..." oninput="syncRuleDraftItem(\'' + ctxKey + '\',' + idx + ',this.value)" />' +
        '<button type="button" class="prize-row-del-btn" aria-label="Delete rule" onclick="removeRuleDraftItem(\'' + ctxKey + '\',' + idx + ')">&#10005;</button>' +
      '</div>';
    }).join("");
  }

  function syncRulesDraftFromDom(ctxKey) {
    if (!ui.rulesDrafts) ui.rulesDrafts = {};
    var list = ui.rulesDrafts[ctxKey] || [];
    list.forEach(function(_, idx) {
      var el = document.getElementById("ruleInput_" + ctxKey + "_" + idx);
      if (el) list[idx] = el.value;
    });
    return list;
  }

  window.syncRuleDraftItem = function(ctxKey, idx, val) {
    if (!ui.rulesDrafts || !ui.rulesDrafts[ctxKey]) return;
    ui.rulesDrafts[ctxKey][idx] = String(val || "");
  };

  window.addRuleDraftItem = function(ctxKey) {
    var list = syncRulesDraftFromDom(ctxKey);
    var addEl = document.getElementById("newRuleInput_" + ctxKey);
    var txt = addEl ? addEl.value.trim() : "";
    if (!txt) {
      list.push("");
    } else {
      list.push(txt);
      if (addEl) addEl.value = "";
    }
    var wrap = document.getElementById("rulesWrap_" + ctxKey);
    if (wrap) wrap.innerHTML = renderAdminRulesListHtml(ctxKey);
  };

  window.removeRuleDraftItem = function(ctxKey, idx) {
    var list = syncRulesDraftFromDom(ctxKey);
    list.splice(idx, 1);
    var wrap = document.getElementById("rulesWrap_" + ctxKey);
    if (wrap) wrap.innerHTML = renderAdminRulesListHtml(ctxKey);
  };

  window.selectAdminRulesTarget = function(targetKey) {
    ui.adminRulesTarget = targetKey;
    if (!ui.rulesDrafts) ui.rulesDrafts = {};
    ui.rulesDrafts.tab = getRulesTargetInfo(targetKey).rules;
    renderApp();
  };

  window.saveAdminRules = function(ctxKey, targetKey, closeAfter) {
    if (!isCurrentUserAdmin()) return;
    var list = syncRulesDraftFromDom(ctxKey).map(function(x) { return String(x || "").trim(); }).filter(Boolean);
    var key = String(targetKey || ui.adminRulesTarget || "mode:BR Match");
    if (key.indexOf("match:") === 0) {
      var mid = key.slice(6);
      var m = state.matches.find(function(x) { return x.id === mid; });
      if (!m) return;
      m.useCustomRules = true;
      m.rules = list;
    } else {
      var modeId = key.indexOf("mode:") === 0 ? key.slice(5) : "BR Match";
      if (!state.modeRules) state.modeRules = createDefaultModeRules();
      state.modeRules[modeId] = list;
    }
    saveState();
    if (closeAfter) closeModal();
    renderApp();
    showToast("Rules saved & updated in user app!", "success");
  };

  // ==================== ADMIN MATCH PLAYERS & 48-SLOT MANAGEMENT ====================
  window.openManageMatchPlayersModal = function(matchId, viewMode) {
    if (!isCurrentUserAdmin()) return;
    var m = state.matches.find(function(x) { return x.id === matchId; });
    if (!m) return;
    var participants = normalizeMatchParticipants(m);
    var totalSlots = Math.max(1, Number(m.totalSlots || 48));
    var showAllSlots = viewMode === "all";
    var slotMap = Object.create(null);
    participants.forEach(function(p) {
      if (p.slot >= 1 && p.slot <= totalSlots) slotMap[p.slot] = p;
    });

    var listHtml = "";
    if (showAllSlots) {
      for (var s = 1; s <= totalSlots; s++) {
        var occ = slotMap[s] || null;
        if (occ) {
          listHtml += '<div class="slot-row occupied" style="margin-bottom:6px;">' +
            '<div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;">' +
              '<div class="slot-num-pill">#' + s + '</div>' +
              '<div style="min-width:0;flex:1;">' +
                '<div style="font-size:13.5px;font-weight:800;color:var(--text);">' + escapeHtml(occ.ign || occ.name) + '</div>' +
                '<div style="font-size:11.5px;color:#38BDF8;font-weight:700;">UID: ' + escapeHtml(occ.uid || "Not provided") + '</div>' +
              '</div>' +
            '</div>' +
            '<button type="button" class="btn btn-danger btn-sm" style="min-height:32px;padding:0 10px;font-size:11px;" onclick="adminRemoveMatchParticipant(\'' + escapeHtml(m.id) + '\',' + s + ',\'' + escapeHtml(showAllSlots ? "all" : "joined") + '\')">Remove</button>' +
          '</div>';
        } else {
          listHtml += '<div class="slot-row available" style="margin-bottom:6px;">' +
            '<div style="display:flex;align-items:center;gap:10px;"><div class="slot-num-pill">#' + s + '</div><span style="font-size:12.5px;color:var(--text-3);font-weight:700;">Available</span></div>' +
            '<span class="slot-avail-pill">Empty</span>' +
          '</div>';
        }
      }
    } else if (participants.length === 0) {
      listHtml = '<div class="empty-state" style="padding:18px;"><strong>No registered players yet</strong><span>All ' + totalSlots + ' slots are currently available.</span></div>';
    } else {
      listHtml = participants.map(function(p) {
        return '<div class="slot-row occupied" style="margin-bottom:8px;flex-wrap:wrap;">' +
          '<div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;">' +
            '<div class="slot-num-pill">#' + Number(p.slot) + '</div>' +
            '<div style="min-width:0;flex:1;">' +
              '<div style="font-size:13.5px;font-weight:800;color:var(--text);">' + escapeHtml(p.ign || p.name) + ' <span style="font-size:11.5px;color:var(--text-3);font-weight:600;">(' + escapeHtml(p.name) + ')</span></div>' +
              '<div style="font-size:11.5px;color:#38BDF8;font-weight:700;">UID: ' + escapeHtml(p.uid || "Not provided") + '</div>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:6px;">' +
            '<input id="admSlotInput_' + Number(p.slot) + '" class="field-input" style="width:62px;min-height:34px;padding:0 8px;font-size:12.5px;font-weight:800;text-align:center;" type="number" min="1" max="' + totalSlots + '" value="' + Number(p.slot) + '" />' +
            '<button type="button" class="btn btn-info btn-sm" style="min-height:34px;padding:0 10px;font-size:11px;" onclick="adminUpdateParticipantSlot(\'' + escapeHtml(m.id) + '\',' + Number(p.slot) + ')">Set Slot</button>' +
            '<button type="button" class="btn btn-danger btn-sm" style="min-height:34px;padding:0 10px;font-size:11px;" onclick="adminRemoveMatchParticipant(\'' + escapeHtml(m.id) + '\',' + Number(p.slot) + ',\'joined\')">Remove</button>' +
          '</div>' +
        '</div>';
      }).join("");
    }

        '<strong>' + escapeHtml(getDynamicMatchTitle(m)) + '</strong>' +
        '<div style="font-size:12px;color:var(--text-3);margin-top:3px;">Registered: <strong>' + participants.length + ' / ' + totalSlots + '</strong> slots &bull; Available: ' + Math.max(0, totalSlots - participants.length) + '</div>' +
      '</div>' +
      '<div class="filter-row" style="margin-bottom:10px;">' +
        '<button type="button" class="chip-tab ' + (!showAllSlots ? "active" : "") + '" onclick="openManageMatchPlayersModal(\'' + escapeHtml(m.id) + '\',\'joined\')">Registered (' + participants.length + ')</button>' +
        '<button type="button" class="chip-tab ' + (showAllSlots ? "active" : "") + '" onclick="openManageMatchPlayersModal(\'' + escapeHtml(m.id) + '\',\'all\')">All 1-' + totalSlots + ' Slots</button>' +
      '</div>' +
      listHtml;

    openModal({ title: "👥 Match Players & Slots", body: body, size: "large" });

  window.adminUpdateParticipantSlot = function(matchId, currentSlot) {
    if (!isCurrentUserAdmin()) return;
    var m = state.matches.find(function(x) { return x.id === matchId; });
    if (!m) return;
    var maxSlots = Math.max(1, Number(m.totalSlots || 48));
    var el = document.getElementById("admSlotInput_" + currentSlot);
    var newSlot = el ? parseInt(el.value, 10) : 0;
    if (!newSlot || newSlot < 1 || newSlot > maxSlots) {
      showToast("Slot must be between 1 and " + maxSlots + ".", "error");
      return;
    }
    var target = (m.participants || []).find(function(p) { return Number(p.slot) === Number(currentSlot); });
    if (!target) return;
    var clash = (m.participants || []).find(function(p) { return p !== target && Number(p.slot) === newSlot; });
    if (clash) {
      showToast("Slot #" + newSlot + " is already occupied by " + (clash.ign || clash.name) + ".", "error");
      return;
    }
    target.slot = newSlot;
    normalizeMatchParticipants(m);
    saveState();
    renderApp();
    openManageMatchPlayersModal(matchId, "joined");
    showToast("Updated slot to #" + newSlot + "!", "success");
  };

  window.adminRemoveMatchParticipant = function(matchId, slotNum, viewMode) {
    if (!isCurrentUserAdmin()) return;
    var m = state.matches.find(function(x) { return x.id === matchId; });
    if (!m) return;
    var target = (m.participants || []).find(function(p) { return Number(p.slot) === Number(slotNum); });
    if (!target) return;
    m.participants = (m.participants || []).filter(function(p) { return p !== target; });
    var refundUser = state.users.find(function(u) { return normalizeEmail(u.email) === normalizeEmail(target.email); });
    var fee = Number(m.entryFee || 0);
    if (refundUser && m.status === "UPCOMING" && fee > 0) {
      refundUser.balance = Number(refundUser.balance || 0) + fee;
      refundUser.matchesPlayed = Math.max(0, Number(refundUser.matchesPlayed || 1) - 1);
      pushTransaction(refundUser.email, "MATCH_REFUND", fee, "Removed from " + getDynamicMatchTitle(m) + " by admin", "COMPLETED");
      pushNotification(refundUser.email, "Match Slot Updated", "Admin removed your registration from " + getDynamicMatchTitle(m) + ". Entry fee ৳" + fee + " refunded.", "info", { category: "MATCH_UPCOMING" });
    }
    saveState();
    renderApp();
    openManageMatchPlayersModal(matchId, viewMode || "joined");
    showToast("Removed " + (target.ign || target.name) + " from Slot #" + slotNum + ".", "info");
  };

  window.saveRoomAndStatus = function(e, matchId) {

    var m = state.matches.find(function(x) { return x.id === matchId; });
    if (!m) return;
    var newStartMs = Number(ui.editRoomUtc || m.startTime || 0);
    var rid = document.getElementById("erId").value.trim();
    var rpass = document.getElementById("erPass").value.trim();
    var st = document.getElementById("erStatus").value;
    var unlockNow = !!document.getElementById("erUnlockNow").checked;
    var roomIdChanged = rid && rid !== m.roomId;
    var roomPassChanged = rpass && rpass !== m.roomPass;
    var prevStatus = m.status;

    if (newStartMs > 0) {
      var dp = getDhakaParts(newStartMs);
      m.startDate = dp.dateStr;
      m.startTimeStr = dp.time24;
      m.startTime = newStartMs;
      m.dateTimeLabel = dp.dateStr + " • " + dp.time12 + " BST";
    }
    m.roomId = rid;
    m.roomPass = rpass;
    m.status = st;
    if (st === "UPCOMING" && m.startTime > getServerNow()) {
      m.startNotified = false;
    }
    m.roomUnlockNow = unlockNow;
    try {
      if (window.RxAndroidBridge && typeof window.RxAndroidBridge.saveMatchRoomVault === "function") {
        window.RxAndroidBridge.saveMatchRoomVault(m.id, rid, rpass);
      }
    } catch (errVault) {}

      (m.participants || []).forEach(function(p) {

        pushNotification(p.email, "Room Password Published!", "Room Password for " + m.title + " has been updated. Tap Room ID button to view & copy.", "info", { category: "ROOM_PASS" });

  function buildAdminUsersRowsHtml(q) {
    var query = String(q || "").trim().toLowerCase();
    var list = (state.users || []).filter(function(u) {
      if (!query) return true;
      return (u.name || "").toLowerCase().indexOf(query) !== -1 ||
        (u.email || "").toLowerCase().indexOf(query) !== -1 ||
        (u.defaultIgn || "").toLowerCase().indexOf(query) !== -1 ||
        (u.phone || "").toLowerCase().indexOf(query) !== -1;
    });
    if (list.length === 0) {
      return '<div class="empty-state"><strong>No matching users</strong>Tap Clear search or wait for players to register.</div>';
    }
    return list.map(function(u) {
      var role = getUserRole(u.email);
      var roleBadge = role === "SUPER_ADMIN" ? "SUPER ADMIN" : (role === "SUB_ADMIN" ? "SUB-ADMIN" : "PLAYER");

      pushTransaction(target.email, txType, amount, note, "COMPLETED");

  window.processWithdraw = function(wdId, approve) {
    if (!isCurrentUserAdmin()) return;
    var w = state.withdrawals.find(function(x) { return x.id === wdId; });
    if (!w || w.status !== "PENDING") return;
    var user = state.users.find(function(u) { return normalizeEmail(u.email) === normalizeEmail(w.userEmail); });

    if (approve) {
      w.status = "APPROVED";
      if (user) {
        user.totalWithdrawn = Number(user.totalWithdrawn || 0) + Number(w.amount);
        pushTransaction(user.email, "WITHDRAW_APPROVED", 0, w.method + " withdrawal ৳" + w.amount + " paid", "COMPLETED");
        pushNotification(user.email, "Withdrawal Approved!", "Your ৳" + w.amount + " withdrawal via " + w.method + " (" + w.phone + ") has been approved and sent!", "success", { category: "WITHDRAW" });
      }
      showToast("Withdrawal approved & user notified.", "success");
    } else {
      w.status = "REJECTED";
      if (user) {
        user.balance = Number(user.balance || 0) + Number(w.amount);
        pushTransaction(user.email, "WITHDRAW_REFUND", Number(w.amount), "Rejected withdrawal refunded (" + w.method + ")", "COMPLETED");
        pushNotification(user.email, "Withdrawal Rejected & Refunded", "Your ৳" + w.amount + " withdrawal was rejected and ৳" + w.amount + " has been refunded to your wallet.", "error", { category: "WITHDRAW" });
      }
      showToast("Withdrawal rejected, refunded & user notified.", "info");
    }
    saveState();
    renderApp();
  };

  window.processDeposit = function(depId, approve) {
    if (!isCurrentUserAdmin()) return;
    var d = state.deposits.find(function(x) { return x.id === depId; });
    if (!d || d.status !== "PENDING") return;
    var user = state.users.find(function(u) { return normalizeEmail(u.email) === normalizeEmail(d.userEmail); });

    if (approve) {
      d.status = "APPROVED";
      if (user) {
        user.balance = Number(user.balance || 0) + Number(d.amount);
        user.totalDeposited = Number(user.totalDeposited || 0) + Number(d.amount);
        pushTransaction(user.email, "DEPOSIT_APPROVED", Number(d.amount), d.method + " TrxID: " + d.trxId, "COMPLETED");
        pushNotification(user.email, "Deposit Approved!", "৳" + d.amount + " has been credited to your wallet.", "success", { category: "DEPOSIT" });
      }
      showToast("Deposit approved & credited!", "success");
    } else {
      d.status = "REJECTED";
      if (user) {
        pushNotification(user.email, "Deposit Rejected", "Your ৳" + d.amount + " deposit (TrxID: " + d.trxId + ") could not be verified.", "error", { category: "DEPOSIT" });

      showToast("Deposit rejected & user notified.", "info");

    saveState();
    renderApp();
  };

  function buildDefaultEditorSession(existingAnn, useSavedDraft) {
    var now = getServerNow();
    var defUtc = now + 1800000; // default +30 min in Asia/Dhaka
    var dp = getDhakaParts(defUtc);
    var base = {
      editingId: null,
      title: "",
      description: "",
      fullText: "",
      imageDataUrl: "",
      telegramUrl: (state.config && state.config.telegram && state.config.telegram.url) || "https://t.me/rxtourbd",
      buttonText: "Join Telegram",
      dateStr: dp.dateStr,
      hour12: dp.hour12,
      minute: dp.minute,
      ampm: dp.ampm,
      calYear: dp.year,
      calMonth: dp.month,
      savedAt: 0
    };

    if (existingAnn) {
      var targetMs = Number(existingAnn.publishAt) > 0 ? Number(existingAnn.publishAt) : defUtc;
      var edp = getDhakaParts(targetMs);
      base.editingId = existingAnn.id;
      base.title = existingAnn.title || "";
      base.description = existingAnn.description || "";
      base.fullText = existingAnn.fullText || existingAnn.description || "";
      base.imageDataUrl = existingAnn.imageDataUrl || "";
      base.telegramUrl = existingAnn.telegramUrl || base.telegramUrl;
      base.buttonText = existingAnn.buttonText || "Join Telegram";
      base.dateStr = existingAnn.date || edp.dateStr;
      base.hour12 = edp.hour12;
      base.minute = edp.minute;
      base.ampm = edp.ampm;
      var dParts = base.dateStr.split("-");
      if (dParts.length === 3) {
        base.calYear = Number(dParts[0]) || edp.year;
        base.calMonth = (Number(dParts[1]) - 1);
      }
      base.savedAt = existingAnn.createdAt || now;
    } else if (useSavedDraft && state.editorDraft) {
      base = Object.assign({}, base, state.editorDraft);
      var ddParts = String(base.dateStr || dp.dateStr).split("-");
      if (ddParts.length === 3) {
        base.calYear = Number(ddParts[0]) || dp.year;
        base.calMonth = (Number(ddParts[1]) - 1);
      }
    }
    return base;
  }

    var cells = "";

  function syncSessionInputsFromDom() {
    if (!editorSession) return;
    var t = document.getElementById("fmeTitle");
    var d = document.getElementById("fmeDesc");
    var f = document.getElementById("fmeFullText");
    var u = document.getElementById("fmeTgUrl");
    var b = document.getElementById("fmeBtnText");
    if (t) editorSession.title = t.value;
    if (d) editorSession.description = d.value;
    if (f) editorSession.fullText = f.value;
    if (u) editorSession.telegramUrl = u.value;
    if (b) editorSession.buttonText = b.value;

  function refreshFmePartialViews() {
    var cnt = document.getElementById("fmeCharCount");
    if (cnt) cnt.textContent = (editorSession.fullText || "").length + " chars";

    if (prevWrap) prevWrap.innerHTML = renderFmeLivePreviewHtml();
    var dtPrev = document.getElementById("fmeDtPreviewBanner");

  function persistAutoDraftNow() {
    if (!editorSession) return;
    syncSessionInputsFromDom();
    editorSession.savedAt = getServerNow();
    state.editorDraft = Object.assign({}, editorSession);
    saveState();
    var stEl = document.getElementById("fmeDraftStatus");
    if (stEl) {
      var dp = getDhakaParts(editorSession.savedAt);

  window.fmeCalStepMonth = function(delta) {
    if (!editorSession) return;
    var m = editorSession.calMonth + delta;
    var y = editorSession.calYear;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    editorSession.calMonth = m;
    editorSession.calYear = y;
    refreshPickerNodes();
  };

  window.fmeSelectDate = function(dateStr) {
    if (!editorSession) return;
    editorSession.dateStr = dateStr;
    var p = dateStr.split("-");
    if (p.length === 3) {
      editorSession.calYear = Number(p[0]);
      editorSession.calMonth = Number(p[1]) - 1;
    }
    refreshPickerNodes();
  };

  window.fmeQuickDate = function(dayOffset) {
    var dp = getDhakaParts(getServerNow() + Number(dayOffset || 0) * 86400000);
    editorSession.dateStr = dp.dateStr;
    editorSession.calYear = dp.year;
    editorSession.calMonth = dp.month;
    refreshPickerNodes();
  };

  window.fmeStepHour = function(delta) {
    if (!editorSession) return;
    var h = editorSession.hour12 + delta;
    if (h > 12) h = 1;
    if (h < 1) h = 12;
    editorSession.hour12 = h;
    refreshPickerNodes();
  };

  window.fmeSelectHour = function(h) {
    if (!editorSession) return;
    editorSession.hour12 = Number(h);
    refreshPickerNodes();
  };

  window.fmeStepMin = function(delta) {
    if (!editorSession) return;
    var mn = (editorSession.minute + delta + 60) % 60;
    editorSession.minute = mn;
    refreshPickerNodes();

  function upsertEditorRecord(status, pubUtc, now) {
    var title = (editorSession.title || "").trim();
    var desc = (editorSession.description || "").trim();
    var full = (editorSession.fullText || "").trim();
    if (!desc && full) desc = full.slice(0, 140);
    if (!full && desc) full = desc;
    var dp = getDhakaParts(pubUtc);
    var recId = editorSession.editingId || ("sa_" + now);
    var existingIdx = (state.scheduledAnnouncements || []).findIndex(function(a) { return a.id === recId; });
    var record = {
      id: recId,
      title: title || "Draft Announcement",
      description: desc,
      fullText: full,
      imageDataUrl: editorSession.imageDataUrl || "",
      date: dp.dateStr,
      time: dp.time24,
      telegramUrl: (editorSession.telegramUrl || "").trim(),
      buttonText: (editorSession.buttonText || "").trim() || "Join Telegram",
      publishAt: pubUtc,
      status: status,
      notified: status === "PUBLISHED",
      publishedAt: status === "PUBLISHED" ? now : 0,
      createdAt: existingIdx >= 0 ? state.scheduledAnnouncements[existingIdx].createdAt : now
    };
    if (existingIdx >= 0) {
      state.scheduledAnnouncements[existingIdx] = record;
    } else {
      state.scheduledAnnouncements.unshift(record);
    }
    return record;
  }

  window.fmeSaveDraft = function() {
    if (!isCurrentUserAdmin() || !editorSession) return;
    syncSessionInputsFromDom();
    if (!editorSession.title.trim() && !editorSession.fullText.trim() && !editorSession.description.trim()) {
      showToast("Write a title or message before saving draft.", "error");
      return;
    }
    var now = getServerNow();
    var pubUtc = dhakaToUtcMs(editorSession.dateStr, editorSession.hour12, editorSession.minute, editorSession.ampm);
    var rec = upsertEditorRecord("DRAFT", pubUtc, now);
    editorSession.editingId = rec.id;
    persistAutoDraftNow();
    saveState();
    renderApp();
    showToast("Message saved to Drafts!", "success");
  };

  window.fmeScheduleMessage = function() {
    if (!isCurrentUserAdmin() || !editorSession) return;
    syncSessionInputsFromDom();
    if (!editorSession.title.trim()) {
      showToast("Please enter a Message Title.", "error");
      return;
    }
    if (!editorSession.fullText.trim() && !editorSession.description.trim()) {
      showToast("Please write your message content.", "error");
      return;
    }
    var now = getServerNow();
    var pubUtc = dhakaToUtcMs(editorSession.dateStr, editorSession.hour12, editorSession.minute, editorSession.ampm);
    if (!pubUtc || pubUtc <= now + 10000) {
      showToast("Select a future Asia/Dhaka date & time to schedule, or tap PUBLISH NOW.", "error");
      return;
    }
    upsertEditorRecord("SCHEDULED", pubUtc, now);
    state.editorDraft = null;
    saveState();
    window.fmeCancelEditor();
    renderApp();
    showToast("Message scheduled for " + formatDhakaDateTime(pubUtc) + "!", "success");
  };

  function publishAnnouncementRecord(ann, now) {
    if (!ann || publishingGuard[ann.id] || (ann.status === "PUBLISHED" && ann.notified)) {
      return false;
    }
    publishingGuard[ann.id] = true;
    ann.status = "PUBLISHED";
    ann.notified = true;
    ann.publishedAt = now;
    if (!ann.publishAt || Number(ann.publishAt) > now) ann.publishAt = now;

    if (!state.broadcasts.some(function(b) { return b.sourceAnnId === ann.id; })) {
      state.broadcasts.unshift({
        id: "bc_" + now + "_" + ann.id,
        sourceAnnId: ann.id,
        title: ann.title,
        message: ann.description || ann.fullText || "",
        createdAt: now
      });
    }
    var notifBody = ann.description || (ann.fullText ? ann.fullText.slice(0, 160) : "New announcement published.");
    state.users.forEach(function(u) {
      pushNotification(u.email, ann.title, notifBody, "info", {
        category: "ADMIN",
        fullText: ann.fullText || ann.description || "",
        imageDataUrl: ann.imageDataUrl || "",
        telegramUrl: ann.telegramUrl || "",
        buttonText: ann.buttonText || "Open Telegram"
      });
    });
    return true;
  }

  window.fmePublishNow = function() {
    if (!isCurrentUserAdmin() || !editorSession) return;
    syncSessionInputsFromDom();
    if (!editorSession.title.trim()) {
      showToast("Please enter a Message Title.", "error");
      return;
    }
    if (!editorSession.fullText.trim() && !editorSession.description.trim()) {
      showToast("Please write your message content.", "error");
      return;
    }
    var now = getServerNow();
    var existing = editorSession.editingId
      ? (state.scheduledAnnouncements || []).find(function(a) { return a.id === editorSession.editingId; })
      : null;
    if (existing && existing.status === "PUBLISHED" && existing.notified) {
      // Editing an already published message updates text cleanly without spamming duplicate notifications
      upsertEditorRecord("PUBLISHED", existing.publishAt || now, now);
      state.editorDraft = null;
      saveState();
      window.fmeCancelEditor();
      renderApp();
      showToast("Published message updated!", "success");
      return;
    }
    var rec = upsertEditorRecord("SCHEDULED", now, now);
    publishAnnouncementRecord(rec, now);
    state.editorDraft = null;
    saveState();
    window.fmeCancelEditor();
    renderApp();
    showToast("Message published & all users notified!", "success");
  };

  window.addSubAdmin = function(e) {
    e.preventDefault();
    if (!isCurrentUserSuperAdmin()) {
      showToast("Restricted: Only Super Admin can manage admins.", "error");
      return;
    }
    if (state.subAdmins.length >= 2) {
      showToast("Maximum 2 Sub-Admins allowed.", "error");
      return;
    }
    var email = normalizeEmail(document.getElementById("saEmailInput").value);
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showToast("Enter a valid email address.", "error");
      return;
    }
    if (isSuperAdminEmail(email)) {
      showToast("This account already holds Super Admin access.", "error");
      return;
    }
    if (state.subAdmins.some(function(s) { return normalizeEmail(s.email) === email; })) {
      showToast("This email is already a Sub-Admin.", "error");
      return;
    }
    state.subAdmins.push({ email: email, addedAt: Date.now() });
    pushNotification(email, "Sub-Admin Role Granted", "You now have Sub-Admin access to RX TOUR BD Admin Panel.", "info", { category: "ACCOUNT" });
    saveState();
    renderApp();
    showToast("Sub-Admin added!", "success");
  };

    var utc = dhakaToUtcMs(sess.dateStr, sess.hour12, sess.minute, sess.ampm);
    var dp = getDhakaParts(utc);
    var diffSec = Math.floor((utc - getServerNow()) / 1000);
    var msg = diffSec > 0
      ? ("⏳ Starts in " + Math.floor(diffSec / 3600) + "h " + pad2(Math.floor((diffSec % 3600) / 60)) + "m (Bangladesh Standard Time • Asia/Dhaka)")
      : "⚠️ Selected time is in the past — adjust if scheduling future match/banner";
    return '<div class="dt-preview-main">&#128197; ' + escapeHtml(dp.readableDate) + ' &bull; &#9200; ' + escapeHtml(dp.time12) + '</div>' +
      '<div class="dt-preview-sub">' + escapeHtml(msg) + '</div>';
  }

  function refreshDtModalNodes() {
    if (!dtPickerSession) return;
    var c = document.getElementById("dtCalWrap");
    var t = document.getElementById("dtTimeWrap");
    var p = document.getElementById("dtPrevWrap");
    if (c) c.innerHTML = renderDtCalendarHtml(dtPickerSession);
    if (t) t.innerHTML = renderDtTimeHtml(dtPickerSession);
    if (p) p.innerHTML = renderDtPreviewHtml(dtPickerSession);
  }

  window.openDhakaDateTimeModal = function(opts) {
    var cfg = opts || {};
    var initUtc = Number(cfg.initialUtcMs) > 0 ? Number(cfg.initialUtcMs) : (getServerNow() + 3600000);
    var dp = getDhakaParts(initUtc);
    dtPickerSession = {
      dateStr: dp.dateStr,
      hour12: dp.hour12,
      minute: dp.minute,
      ampm: dp.ampm,
      calYear: dp.year,
      calMonth: dp.month,
      allowClear: !!cfg.allowClear,
      onConfirm: cfg.onConfirm,
      onClear: cfg.onClear
    };
    var body = '<div id="dtCalWrap">' + renderDtCalendarHtml(dtPickerSession) + '</div>' +
      '<div id="dtTimeWrap">' + renderDtTimeHtml(dtPickerSession) + '</div>' +
      '<div id="dtPrevWrap" class="dt-preview-banner">' + renderDtPreviewHtml(dtPickerSession) + '</div>' +
      '<div class="detail-btn-pair" style="margin-top:14px;">' +
        (dtPickerSession.allowClear
          ? '<button type="button" class="btn btn-secondary" onclick="dtClearSelection()">Clear Schedule</button>'
          : '<button type="button" class="btn btn-secondary" onclick="modalBack()">Cancel</button>') +
        '<button type="button" class="btn btn-primary" onclick="dtConfirmSelection()">APPLY TIME (BST)</button>' +
      '</div>';
    openModal({
      title: cfg.title || "Asia/Dhaka Date & Time",
      body: body,
      size: "large",
      push: cfg.push !== false && ui.modalStack.length > 0
    });
  };

  window.dtCalStepMonth = function(d) {
    if (!dtPickerSession) return;
    var m = dtPickerSession.calMonth + d;
    var y = dtPickerSession.calYear;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    dtPickerSession.calMonth = m;
    dtPickerSession.calYear = y;
    refreshDtModalNodes();
  };
  window.dtSelectDate = function(dateStr) {
    if (!dtPickerSession) return;
    dtPickerSession.dateStr = dateStr;
    var p = dateStr.split("-");
    if (p.length === 3) { dtPickerSession.calYear = Number(p[0]); dtPickerSession.calMonth = Number(p[1]) - 1; }
    refreshDtModalNodes();
  };
  window.dtQuickDate = function(offset) {
    if (!dtPickerSession) return;
    var dp = getDhakaParts(getServerNow() + Number(offset || 0) * 86400000);
    dtPickerSession.dateStr = dp.dateStr;
    dtPickerSession.calYear = dp.year;
    dtPickerSession.calMonth = dp.month;
    refreshDtModalNodes();
  };
  window.dtStepHour = function(d) {
    if (!dtPickerSession) return;
    var h = dtPickerSession.hour12 + d;
    if (h > 12) h = 1;
    if (h < 1) h = 12;
    dtPickerSession.hour12 = h;
    refreshDtModalNodes();
  };
  window.dtSelectHour = function(h) {
    if (!dtPickerSession) return;
    dtPickerSession.hour12 = Number(h);
    refreshDtModalNodes();
  };
  window.dtStepMin = function(d) {
    if (!dtPickerSession) return;
    dtPickerSession.minute = (dtPickerSession.minute + d + 60) % 60;
    refreshDtModalNodes();
  };
  window.dtSelectMin = function(mn) {
    if (!dtPickerSession) return;
    dtPickerSession.minute = Number(mn);
    refreshDtModalNodes();
  };
  window.dtSetAmPm = function(v) {
    if (!dtPickerSession) return;
    dtPickerSession.ampm = v === "PM" ? "PM" : "AM";
    refreshDtModalNodes();
  };
  window.dtQuickTimeOffset = function(minsAhead) {
    if (!dtPickerSession) return;
    var dp = getDhakaParts(getServerNow() + Number(minsAhead || 15) * 60000);
    dtPickerSession.dateStr = dp.dateStr;
    dtPickerSession.calYear = dp.year;
    dtPickerSession.calMonth = dp.month;
    dtPickerSession.hour12 = dp.hour12;
    dtPickerSession.minute = dp.minute;
    dtPickerSession.ampm = dp.ampm;
    refreshDtModalNodes();
  };
  window.dtQuickFixedTime = function(h12, mn, ampm) {
    if (!dtPickerSession) return;
    dtPickerSession.hour12 = Number(h12);
    dtPickerSession.minute = Number(mn);
    dtPickerSession.ampm = ampm;
    refreshDtModalNodes();
  };
  window.dtConfirmSelection = function() {
    if (!dtPickerSession) return;
    var utcMs = dhakaToUtcMs(dtPickerSession.dateStr, dtPickerSession.hour12, dtPickerSession.minute, dtPickerSession.ampm);
    var dp = getDhakaParts(utcMs);
    var fn = dtPickerSession.onConfirm;
    dtPickerSession = null;
    window.modalBack();
    if (typeof fn === "function") fn(utcMs, dp);
  };
  window.dtClearSelection = function() {
    if (!dtPickerSession) return;
    var fn = dtPickerSession.onClear;
    dtPickerSession = null;
    window.modalBack();
    if (typeof fn === "function") fn();
  };

  // ==================== UNIFIED HALF-SCREEN -> EXPANDABLE BOTTOM SHEET MODAL SYSTEM ====================
  var MODAL_EXPAND_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';
  var MODAL_SHRINK_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';

  function buildModalMarkup(titleText, bodyHtml, isExpanded, hasBackHistory) {
    return '<div class="modal-head">' +
        (hasBackHistory
          ? '<button type="button" class="modal-back-btn" onclick="modalBack()">&larr; Back</button>'
          : '<span style="width:36px;flex-shrink:0;"></span>') +
        '<h3 class="modal-title">' + escapeHtml(titleText || "Details") + '</h3>' +
        '<div class="modal-head-right">' +
          '<button type="button" id="modalExpandBtn" class="modal-expand-btn" aria-label="Toggle modal size" onclick="toggleModalExpand()">' + (isExpanded ? MODAL_SHRINK_SVG : MODAL_EXPAND_SVG) + '</button>' +
          '<button type="button" class="modal-close" aria-label="Close" onclick="closeModal()">&#10005;</button>' +
        '</div>' +
      '</div>' +
      '<div class="modal-body" id="modalScrollBody">' + bodyHtml + '</div>';
  }

  function renderModalFrame(frame) {
    var backdrop = document.getElementById("modalBackdrop");
    var sheet = document.getElementById("modalSheet");
    if (!backdrop || !sheet || !frame) return;
    try {
      ui.modalExpanded = !!frame.expanded;
      sheet.classList.toggle("expanded", ui.modalExpanded);
      var hasHistory = ui.modalStack.length > 1;
      sheet.innerHTML = buildModalMarkup(frame.title, frame.bodyHtml, ui.modalExpanded, hasHistory);
      backdrop.classList.remove("hidden");
      backdrop.scrollTop = 0;
      var bodyEl = document.getElementById("modalScrollBody");
      if (bodyEl) bodyEl.scrollTop = 0;
    } catch (err) {
      sheet.classList.add("expanded");
      sheet.innerHTML = buildModalMarkup("Popup Error", '<div class="modal-error-card"><strong>Failed to render popup</strong><p style="margin:6px 0 12px;font-size:13px;">' + escapeHtml(err && err.message ? err.message : "Unexpected UI error") + '</p><button type="button" class="btn btn-primary btn-block" onclick="closeModal()">Close</button></div>', true, false);
      backdrop.classList.remove("hidden");
    }
  }

  window.toggleModalExpand = function() {
    var sheet = document.getElementById("modalSheet");
    if (!sheet) return;
    ui.modalExpanded = !ui.modalExpanded;
    sheet.classList.toggle("expanded", ui.modalExpanded);
    if (ui.modalStack.length > 0) {
      ui.modalStack[ui.modalStack.length - 1].expanded = ui.modalExpanded;
    }
    var btn = document.getElementById("modalExpandBtn");
    if (btn) btn.innerHTML = ui.modalExpanded ? MODAL_SHRINK_SVG : MODAL_EXPAND_SVG;
  };

  function openModal(input, extraOpts) {
    try {
      var opts = (typeof input === "object" && input !== null)
        ? input
        : Object.assign({ html: String(input || "") }, extraOpts || {});

      var title = opts.title || "";
      var bodyHtml = opts.body || "";

      if (!title && opts.html) {
        var temp = document.createElement("div");
        temp.innerHTML = opts.html;
        var headEl = temp.querySelector(".modal-head");
        if (headEl) {
          var titleEl = headEl.querySelector(".modal-title");
          if (titleEl) title = titleEl.textContent.trim();
          headEl.parentNode.removeChild(headEl);
        }
        bodyHtml = temp.innerHTML;
      }

      var expanded = opts.size === "large" || opts.expanded === true;
      var frame = {
        title: title || "RX TOUR BD",
        bodyHtml: bodyHtml || '<div class="empty-state"><strong>Nothing to show</strong>Please try again.</div>',
        expanded: expanded
      };

      if (opts.push && ui.modalStack.length > 0) {
        ui.modalStack.push(frame);
      } else {
        ui.modalStack = [frame];
      }
      renderModalFrame(frame);
    } catch (err) {
      var fallbackFrame = {
        title: "Notice",
        bodyHtml: '<div class="modal-error-card"><strong>Popup could not open cleanly</strong><p style="margin:6px 0 12px;font-size:13px;">' + escapeHtml(err && err.message ? err.message : "Error") + '</p><button type="button" class="btn btn-primary btn-block" onclick="closeModal()">Close</button></div>',
        expanded: true
      };
      ui.modalStack = [fallbackFrame];
      renderModalFrame(fallbackFrame);
    }
  }

  window.modalBack = function() {
    if (ui.modalStack.length > 1) {
      ui.modalStack.pop();
      var prev = ui.modalStack[ui.modalStack.length - 1];
      renderModalFrame(prev);
    } else {
      window.closeModal();
    }
  };

  window.closeModal = function() {
    ui.roomModalReqId = (ui.roomModalReqId || 0) + 1;
    var backdrop = document.getElementById("modalBackdrop");
    if (backdrop) backdrop.classList.add("hidden");
    var sheet = document.getElementById("modalSheet");
    if (sheet) sheet.classList.remove("expanded");
    ui.modalStack = [];
    ui.modalExpanded = false;
  };

  function closeAllModals() {
    window.closeModal();
  }

  window.handleBackdropClick = function(e) {
    if (e.target && e.target.id === "modalBackdrop") {
      window.closeModal();
    }
  };

  var pendingConfirmFn = null;
  window.openConfirmModal = function(opts) {
    var cfg = opts || {};
    pendingConfirmFn = typeof cfg.onConfirm === "function" ? cfg.onConfirm : null;
    var isDanger = cfg.danger !== false;
    var body = '<div class="card" style="background:var(--surface-2);border:1.5px solid ' + (isDanger ? "rgba(244,63,94,0.48)" : "rgba(56,189,248,0.48)") + ';padding:18px;margin-top:8px;">' +
      '<div style="font-size:32px;margin-bottom:8px;">' + (isDanger ? "&#9888;" : "&#10067;") + '</div>' +
      '<h3 style="margin:0 0 8px;font-size:18px;color:var(--text);">' + escapeHtml(cfg.title || "Confirm Action") + '</h3>' +
      '<p style="margin:0 0 18px;font-size:14px;line-height:1.55;color:var(--text-2);">' + escapeHtml(cfg.message || "Are you sure you want to continue?") + '</p>' +
      '<div class="detail-btn-pair">' +
        '<button type="button" class="btn btn-secondary" onclick="modalBack()">' + escapeHtml(cfg.cancelText || "Cancel") + '</button>' +
        '<button type="button" class="btn ' + (isDanger ? "btn-danger" : "btn-primary") + '" onclick="runConfirmedModalAction()">' + escapeHtml(cfg.confirmText || "Confirm") + '</button>' +
      '</div>' +
    '</div>';
    openModal({ title: cfg.title || "Confirm Action", body: body, size: "half", push: !!cfg.push });
  };

  window.runConfirmedModalAction = function() {
    var fn = pendingConfirmFn;
    pendingConfirmFn = null;
    window.closeModal();
    if (typeof fn === "function") fn();
  };

  window.rxFocusScroll = function(el) {
    if (!el) return;
    setTimeout(function() {
      try { el.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {}
    }, 280);
  };

  // Global Android Keyboard & Viewport Compatibility Listener
  document.addEventListener("focusin", function(ev) {
    var target = ev.target;
    if (!target) return;
    var tag = target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") {
      window.rxFocusScroll(target);
    }
  });

  if (window.visualViewport && typeof window.visualViewport.addEventListener === "function") {
    window.visualViewport.addEventListener("resize", function() {
      var active = document.activeElement;
      if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT")) {
        window.rxFocusScroll(active);
      }
    });
  }

  window.copyText = function(text, customMessage) {
    if (!text) return;
    var okMsg = customMessage || ("Copied: " + text);
    var nativeCopied = false;
    try {
      if (window.RxAndroidBridge && typeof window.RxAndroidBridge.copyToClipboard === "function") {
        nativeCopied = !!window.RxAndroidBridge.copyToClipboard("RX TOUR BD", String(text));
      }
    } catch (eNative) {}
    if (nativeCopied) {
      showToast(okMsg, "success");
      return;
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          showToast(okMsg, "success");
        }).catch(function() {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          showToast(okMsg, "success");
        });
      } else {
        var ta2 = document.createElement("textarea");
        ta2.value = text;
        ta2.style.position = "fixed";
        ta2.style.opacity = "0";
        document.body.appendChild(ta2);
        ta2.select();
        document.execCommand("copy");
        document.body.removeChild(ta2);
        showToast(okMsg, "success");
      }
    } catch (e) {
      showToast("Text: " + text, "info");
    }
  };

  function formatCountdownParts(diffSec) {
    var h = Math.floor(diffSec / 3600);
    var m = Math.floor((diffSec % 3600) / 60);
    var s = diffSec % 60;
    return '<span class="cd-h">' + pad2(h) + 'h</span> <span class="cd-m">' + pad2(m) + 'm</span> <span class="cd-s">' + pad2(s) + 's</span>';
  }

  function processLifecycleTransitions() {
    var now = getServerNow();
    var changed = false;

    // 1. Match countdown -> STARTED transition + Start Notification
    state.matches.forEach(function(m) {
      if (m.status === "UPCOMING" && Number(m.startTime) > 0 && now >= Number(m.startTime)) {
        m.status = "STARTED";
        changed = true;
        if (!m.startNotified) {
          m.startNotified = true;
          (m.participants || []).forEach(function(p) {
            pushNotification(p.email, "Match Started!", m.title + " has started now! Join your room immediately.", "success", { category: "MATCH_STARTED" });
          });
          var cur = getCurrentUser();
          if (cur && (m.participants || []).some(function(p) { return normalizeEmail(p.email) === normalizeEmail(cur.email); })) {
            showToast("Match Started: " + m.title, "success");
          }
        }
      }
    });

    // 2. Scheduled Announcement -> PUBLISHED transition + Notification (strictly idempotent)
    (state.scheduledAnnouncements || []).forEach(function(a) {
      if (a.status === "SCHEDULED" && !a.notified && Number(a.publishAt) > 0 && now >= Number(a.publishAt)) {
        if (publishAnnouncementRecord(a, now)) {
          changed = true;
          showToast("Announcement Published: " + a.title, "info");
        }
      }
    });

    if (changed) {
      saveState();
      if (getCurrentUser()) {
        renderApp();
      }
    }
    return changed;
  }

  function updateCountdowns() {
    var now = getServerNow();
    var els = document.querySelectorAll("[data-countdown]");
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      var st = el.getAttribute("data-status");
      var target = Number(el.getAttribute("data-countdown"));
      if (st === "CANCELLED") {
        el.innerHTML = '<span style="color:#F87171;">CANCELLED</span>';
        continue;
      }
      if (st === "COMPLETED") {
        el.innerHTML = '<span style="color:#34D399;">ENDED</span>';
        continue;
      }
      if (st === "STARTED") {
        el.innerHTML = '<span style="color:#34D399;">STARTED</span>';
        continue;
      }
      if (st === "LIVE") {
        el.innerHTML = '<span style="color:#FB7185;">LIVE NOW</span>';
        continue;
      }
      var diff = Math.max(0, Math.floor((target - now) / 1000));
      if (diff === 0) {
        el.innerHTML = '<span style="color:#34D399;">STARTED</span>';
        continue;
      }
      el.innerHTML = formatCountdownParts(diff);
    }

    var pubEls = document.querySelectorAll("[data-pub-countdown]");
    for (var j = 0; j < pubEls.length; j++) {
      var pel = pubEls[j];
      var pTarget = Number(pel.getAttribute("data-pub-countdown"));
      var pDiff = Math.max(0, Math.floor((pTarget - now) / 1000));
      if (pDiff === 0) {
        pel.textContent = "PUBLISHED";
      } else {
        var ph = Math.floor(pDiff / 3600);
        var pm = Math.floor((pDiff % 3600) / 60);
        var ps = pDiff % 60;
        pel.textContent = pad2(ph) + "h " + pad2(pm) + "m " + pad2(ps) + "s";
      }
    }
  }

  function tickTimers() {
    if (!processLifecycleTransitions()) {
      updateCountdowns();
    }
  }

  setInterval(tickTimers, 1000);
  setInterval(syncServerTime, 300000);

  // Android Back Button Bridge
  window.rxHandleBack = function() {
    if (ui.fullEditorOpen) {
      window.fmeCancelEditor();
      return "handled";
    }
    if (ui.modalStack.length > 0) {
      window.modalBack();
      return "handled";
    }
    if (!getCurrentUser()) return "exit";
    if (ui.selectedMatchId) {
      ui.selectedMatchId = null;
      renderApp();
      return "handled";
    }
    if (ui.selectedMode) {
      ui.selectedMode = null;
      renderApp();
      return "handled";
    }
    if (ui.activeTab !== "home") {
      ui.activeTab = "home";
      renderApp();
      return "handled";
    }
    return "exit";
  };

  // Boot
  syncAllMatchesToVault();
  syncServerTime();
  processLifecycleTransitions();
  renderApp();
})();
</script>
</body>
</html>
