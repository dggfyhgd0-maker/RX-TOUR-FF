<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#06080F" />
<title>RX TOUR BD</title>
<style>
  :root {
    --bg: #F3F5FA;
    --surface: #FFFFFF;
    --surface-2: #F1F5F9;
    --surface-3: #E2E8F0;
    --border: #E2E8F0;
    --border-strong: #CBD5E1;
    --text: #0F172A;
    --text-2: #475569;
    --text-3: #64748B;
    --primary: #2563EB;
    --primary-strong: #1D4ED8;
    --primary-soft: rgba(37, 99, 235, 0.12);
    --orange: #F97316;
    --orange-soft: rgba(249, 115, 22, 0.14);
    --purple: #7C3AED;
    --purple-soft: rgba(124, 58, 237, 0.12);
    --accent: #E11D48;
    --accent-soft: rgba(225, 29, 72, 0.12);
    --success: #10B981;
    --success-soft: rgba(16, 185, 129, 0.14);
    --warning: #D97706;
    --warning-soft: rgba(245, 158, 11, 0.14);
    --info: #0284C7;
    --info-soft: rgba(2, 132, 199, 0.12);
    --nav-bg: rgba(255, 255, 255, 0.96);
    --topbar-bg: #0B1120;
    --topbar-text: #F8FAFC;
    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 18px 40px rgba(15, 23, 42, 0.16);
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 22px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  html[data-theme="dark"] {
    --bg: #06080F;
    --surface: #121622;
    --surface-2: #181E2E;
    --surface-3: #20283D;
    --border: #232B3E;
    --border-strong: #323D59;
    --text: #F8FAFC;
    --text-2: #CBD5E1;
    --text-3: #8D99AE;
    --primary: #3B82F6;
    --primary-strong: #2563EB;
    --primary-soft: rgba(59, 130, 246, 0.16);
    --orange: #FB923C;
    --orange-soft: rgba(251, 146, 60, 0.16);
    --purple: #8B5CF6;
    --purple-soft: rgba(139, 92, 246, 0.16);
    --accent: #FB7185;
    --accent-soft: rgba(251, 113, 133, 0.16);
    --success: #34D399;
    --success-soft: rgba(52, 211, 153, 0.16);
    --warning: #FBBF24;
    --warning-soft: rgba(251, 191, 36, 0.16);
    --info: #38BDF8;
    --info-soft: rgba(56, 189, 248, 0.16);
    --nav-bg: rgba(14, 18, 30, 0.96);
    --topbar-bg: #06080F;
    --topbar-text: #F8FAFC;
    --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 20px 52px rgba(0, 0, 0, 0.65);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    min-height: 100%;
    overflow-x: hidden;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
  }
  html[data-theme="light"] {
    color-scheme: light;
  }

  button, input, select, textarea {
    font-family: inherit;
    font-size: inherit;
    outline: none;
  }

  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  textarea:-webkit-autofill,
  select:-webkit-autofill {
    -webkit-box-shadow: 0 0 0 1000px #161E31 inset !important;
    -webkit-text-fill-color: #F8FAFC !important;
    caret-color: #F8FAFC;
  }

  html[data-theme="light"] input:-webkit-autofill,
  html[data-theme="light"] input:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 1000px #F8FAFC inset !important;
    -webkit-text-fill-color: #0F172A !important;
  }

  button {
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }

  .hidden { display: none !important; }

  .app-frame {
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    background: var(--bg);
  }

  /* ==================== AUTH SCREEN ==================== */
  .auth-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px 16px 32px;
    background:
      radial-gradient(circle at 12% 10%, rgba(59, 130, 246, 0.22), transparent 42%),
      radial-gradient(circle at 88% 85%, rgba(139, 92, 246, 0.20), transparent 45%),
      linear-gradient(165deg, #05070D 0%, #0D1324 55%, #111827 100%);
    color: #F8FAFC;
  }

  .auth-brand {
    text-align: center;
    margin-bottom: 22px;
  }

  .auth-logo-ring {
    width: 74px;
    height: 74px;
    margin: 0 auto 12px;
    border-radius: 22px;
    background: linear-gradient(135deg, #38BDF8, #8B5CF6, #F97316);
    padding: 2px;
    box-shadow: 0 12px 30px rgba(59, 130, 246, 0.35);
  }

  .auth-logo-inner {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    background: #070B14;
    padding: 6px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .auth-brand-logo-img {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
  }

  .auth-title {
    margin: 0;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #38BDF8, #FFFFFF, #FB923C);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .auth-subtitle {
    margin: 4px 0 0;
    font-size: 13px;
    color: #94A3B8;
  }

  .auth-card {
    background: #101524;
    border: 1px solid rgba(59, 130, 246, 0.28);
    border-radius: 24px;
    padding: 18px 16px 22px;
    box-shadow: 0 24px 50px rgba(0, 0, 0, 0.55);
  }

  .auth-tabs {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: #080B14;
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 18px;
  }

  .auth-tab-pill {
    position: absolute;
    top: 4px;
    left: 4px;
    width: calc(50% - 4px);
    height: calc(100% - 8px);
    border-radius: 11px;
    background: linear-gradient(135deg, #2563EB, #7C3AED);
    box-shadow: 0 6px 16px rgba(59, 130, 246, 0.38);
    transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 0;
  }

  .auth-tabs[data-pane="signup"] .auth-tab-pill {
    transform: translateX(100%);
  }

  .auth-tab-btn {
    position: relative;
    z-index: 1;
    height: 42px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.7px;
    color: #94A3B8;
    transition: color 0.25s ease;
  }

  .auth-tab-btn.active { color: #FFFFFF; }

  .auth-banner-msg {
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .auth-banner-msg.success {
    background: rgba(16, 185, 129, 0.16);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #6EE7B7;
  }

  .auth-banner-msg.error {
    background: rgba(244, 63, 94, 0.16);
    border: 1px solid rgba(244, 63, 94, 0.4);
    color: #FDA4AF;
  }

  .auth-slider-viewport { overflow: hidden; width: 100%; }

  .auth-slider-track {
    display: flex;
    width: 200%;
    transition: transform 0.40s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }

  .auth-slider-track.show-signup { transform: translateX(-50%); }

  .auth-pane { width: 50%; padding: 2px; flex-shrink: 0; }

  .field-group { margin-bottom: 13px; }

  .field-label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.45px;
    margin-bottom: 6px;
    color: var(--text-2);
  }

  .auth-pane .field-label { color: #CBD5E1; }

  .input-wrap { position: relative; display: flex; align-items: center; }

  .field-input, .field-select, .field-textarea {
    width: 100%;
    min-height: 50px;
    padding: 11px 14px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 14px;
    border: 1.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field-select option,
  select option {
    background-color: #101728;
    color: #F8FAFC;
  }

  html[data-theme="light"] .field-select option,
  html[data-theme="light"] select option {
    background-color: #FFFFFF;
    color: #0F172A;
  }

  .field-textarea {
    min-height: 110px;
    line-height: 1.55;
    resize: vertical;
  }

  .auth-pane .field-input {
    background: #080C16;
    border-color: rgba(148, 163, 184, 0.24);
    color: #F8FAFC;
  }

  .auth-pane .field-input::placeholder { color: #64748B; }

  .field-input:focus, .field-select:focus, .field-textarea:focus {
    outline: none;
    border-color: #38BDF8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22);
  }

  .input-wrap .field-input.has-toggle { padding-right: 48px; }

  .eye-btn {
    position: absolute;
    right: 6px;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94A3B8;
  }

  .btn {
    min-height: 46px;
    padding: 0 16px;
    border-radius: 14px;
    font-weight: 800;
    font-size: 13.5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.12s ease, opacity 0.2s ease, box-shadow 0.2s ease;
  }

  .btn:active { transform: scale(0.98); }

  .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

  .btn-block { width: 100%; }

  .btn-primary {
    background: linear-gradient(135deg, #2563EB, #1D4ED8);
    color: #FFFFFF;
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.34);
  }

  .btn-orange {
    background: linear-gradient(135deg, #F97316, #EA580C);
    color: #FFFFFF;
    box-shadow: 0 8px 20px rgba(249, 115, 22, 0.30);
  }

  .btn-purple {
    background: linear-gradient(135deg, #7C3AED, #6D28D9);
    color: #FFFFFF;
    box-shadow: 0 6px 18px rgba(124, 58, 237, 0.32);
  }

  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border-strong);
  }

  .btn-info {
    background: linear-gradient(135deg, #0EA5E9, #0284C7);
    color: #FFFFFF;
    box-shadow: 0 8px 18px rgba(14, 165, 233, 0.28);
  }

  .btn-success {
    background: linear-gradient(135deg, #10B981, #059669);
    color: #FFFFFF;
  }

  .btn-danger {
    background: linear-gradient(135deg, #F43F5E, #E11D48);
    color: #FFFFFF;
  }

  .btn-sm {
    min-height: 36px;
    padding: 0 12px;
    border-radius: 10px;
    font-size: 12px;
  }

  .auth-switch-link {
    margin-top: 14px;
    width: 100%;
    min-height: 40px;
    color: #94A3B8;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }

  .auth-switch-link span { color: #38BDF8; font-weight: 700; }

  /* ==================== TOP BAR (SCREENSHOT PARITY) ==================== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--topbar-bg);
    color: var(--topbar-text);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid rgba(59, 130, 246, 0.14);
  }

  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }

  .topbar-logo-slot {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.78);
    border: 1px solid rgba(56, 189, 248, 0.32);
    padding: 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }

  .topbar-brand-logo-img {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
  }

  .brand-title {
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.8px;
    white-space: nowrap;
  }

  .brand-rx {
    color: #38BDF8;
  }

  .brand-tour {
    color: #E2E8F0;
    font-weight: 500;
    letter-spacing: 1.5px;
    font-size: 15px;
  }

  .brand-sub {
    font-size: 9.5px;
    color: #64748B;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
  }

  .icon-pill-btn {
    position: relative;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    color: #38BDF8;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .icon-pill-btn.trophy-btn {
    color: #FBBF24;
  }

  .notif-badge {
    position: absolute;
    top: 3px;
    right: 3px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 999px;
    background: #F43F5E;
    color: #FFFFFF;
    font-size: 9.5px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #06080F;
  }

  .wallet-chip {
    min-height: 38px;
    padding: 0 13px;
    border-radius: 999px;
    background: #171C28;
    border: 1px solid rgba(251, 191, 36, 0.35);
    color: #F8FAFC;
    font-weight: 800;
    font-size: 13.5px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .wallet-chip-icon { color: #FBBF24; }

  /* ==================== MAIN CONTENT ==================== */
  .main-content {
    padding: 12px 13px 104px;
  }

  /* ==================== DYNAMIC TELEGRAM HERO IMAGE BANNER ==================== */
  .tg-hero-banner {
    position: relative;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    margin: 0 0 10px;
    border: 1.5px solid transparent;
    background:
      linear-gradient(#0B1222, #0B1222) padding-box,
      linear-gradient(125deg, rgba(56, 189, 248, 0.72), rgba(59, 130, 246, 0.55), rgba(168, 85, 247, 0.72)) border-box;
    box-shadow: 0 10px 28px rgba(14, 165, 233, 0.24), 0 0 22px rgba(139, 92, 246, 0.16);
    display: block;
    text-decoration: none;
    color: #FFFFFF;
    transition: transform 0.16s ease, filter 0.18s ease;
  }

  .tg-hero-banner:active {
    transform: scale(0.99);
  }

  .tg-hero-media {
    position: relative;
    width: 100%;
    height: 158px;
    overflow: hidden;
  }

  @media (min-width: 480px) {
    .tg-hero-media {
      height: 178px;
    }
  }

  .tg-hero-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .tg-hero-overlay {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background: linear-gradient(95deg, rgba(6, 8, 15, 0.90) 0%, rgba(6, 8, 15, 0.62) 55%, rgba(6, 8, 15, 0.25) 100%);
    padding: 13px 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .tg-hero-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .tg-pill-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(14, 165, 233, 0.85);
    border: 1px solid rgba(125, 211, 252, 0.65);
    color: #FFFFFF;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }

  .tg-hero-bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px;
  }

  .tg-hero-text {
    min-width: 0;
    flex: 1;
  }

  .tg-hero-title {
    margin: 0;
    font-size: 15px;
    font-weight: 900;
    line-height: 1.28;
    color: #FFFFFF;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .tg-hero-desc {
    margin: 4px 0 0;
    font-size: 11.5px;
    font-weight: 600;
    color: #CBD5E1;
    line-height: 1.3;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .tg-cta-pill {
    flex-shrink: 0;
    min-height: 34px;
    padding: 0 12px;
    border-radius: 999px;
    background: linear-gradient(135deg, #0EA5E9, #2563EB);
    color: #FFFFFF;
    font-size: 11.5px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    box-shadow: 0 4px 14px rgba(14, 165, 233, 0.45);
  }

  /* ==================== PURPLE NEON ANNOUNCEMENT STRIP ==================== */
  .announce-neon-card {
    background: var(--surface);
    border: 1.5px solid rgba(139, 92, 246, 0.52);
    box-shadow: 0 0 18px rgba(139, 92, 246, 0.16);
    border-radius: 16px;
    padding: 11px 12px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 11px;
    text-decoration: none;
    color: var(--text);
  }

  .announce-icon-box {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: rgba(59, 130, 246, 0.16);
    border: 1px solid rgba(99, 102, 241, 0.35);
    color: #60A5FA;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .announce-thumb {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--border-strong);
  }

  .announce-content {
    min-width: 0;
    flex: 1;
  }

  .announce-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .announce-desc {
    font-size: 11.5px;
    color: var(--text-2);
    margin-top: 2px;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .announce-cd-pill {
    flex-shrink: 0;
    padding: 4px 9px;
    border-radius: 999px;
    background: rgba(139, 92, 246, 0.20);
    border: 1px solid rgba(167, 139, 250, 0.45);
    color: #C4B5FD;
    font-size: 10.5px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  /* ==================== PREMIUM TELEGRAM SUPPORT ANNOUNCEMENT TICKER ==================== */
  .tg-support-banner {
    position: relative;
    width: 100%;
    min-height: 48px;
    margin: 0 0 14px;
    padding: 7px 12px 7px 9px;
    border-radius: 14px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: #F8FAFC;
    background:
      linear-gradient(135deg, rgba(8, 12, 24, 0.94) 0%, rgba(14, 18, 36, 0.88) 55%, rgba(20, 14, 38, 0.92) 100%) padding-box,
      linear-gradient(125deg, #38BDF8 0%, #3B82F6 38%, #8B5CF6 74%, #A855F7 100%) border-box;
    border: 1.5px solid transparent;
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.18), 0 0 24px rgba(139, 92, 246, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    animation: tgSupportGlow 3.2s ease-in-out infinite;
    transition: transform 0.16s ease, filter 0.18s ease;
    cursor: pointer;
    overflow: hidden;
  }

  .tg-support-banner:hover {
    filter: brightness(1.08);
  }

  .tg-support-banner:active {
    transform: scale(0.985);
  }

  @keyframes tgSupportGlow {
    0%, 100% {

    }

      box-shadow: 0 0 20px rgba(56, 189, 248, 0.32), 0 0 30px rgba(168, 85, 247, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.10);
    }

  .tg-support-icon-box {
    position: relative;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.20), rgba(139, 92, 246, 0.24));
    border: 1px solid rgba(56, 189, 248, 0.48);
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    color: #38BDF8;

    filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.65));
  }

  .tg-support-dot {
    position: absolute;
    top: -3px;
    right: -3px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #38BDF8;
    border: 1.5px solid #0B1120;
    box-shadow: 0 0 8px #38BDF8;
  }

  .tg-support-marquee {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
  }

  .tg-support-track {
    display: flex;
    align-items: center;
    width: max-content;
    white-space: nowrap;
    will-change: transform;
    animation: tgSupportMarquee 17s linear infinite;
  }

  .tg-support-banner:hover .tg-support-track {
    animation-play-state: paused;
  }

  .tg-support-text {
    display: inline-flex;
    align-items: center;
    gap: 28px;
    padding-right: 28px;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.15px;
    color: #F1F5F9;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
  }

  .tg-support-sep {
    color: #38BDF8;
    font-size: 11px;
    opacity: 0.85;
  }

  @keyframes tgSupportMarquee {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-50%, 0, 0); }
  }

  @media (min-width: 480px) {

      padding: 10px 16px 10px 12px;
      border-radius: 18px;

    .tg-support-text {

    .tg-support-banner {
      animation: none;
    }
    .tg-support-track {
      animation: none;
      white-space: normal;
      width: 100%;
    }
    .tg-support-text.is-dup {

  .section-head {

  /* ==================== HOME MODE GRID ==================== */

    left: -14%;

    height: 128%;

    max-height: none;
    object-fit: cover;
    object-position: center;

  .mode-art-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(6, 10, 20, 0.04) 48%, rgba(11, 16, 29, 0.82) 100%);

    z-index: 2;
  }

  .mode-rx-badge {
    position: absolute;
    top: 7px;
    right: 7px;

    max-width: 44px;

  .mode-badge-logo-img {

    max-height: 16px;
    object-fit: contain;
    object-position: center;

  .mode-art-stamp {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 7px;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #F8FAFC;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);

  .mode-info { padding: 11px 12px 13px; }

  .mode-name {
    margin: 0;
    font-size: 14.5px;
    font-weight: 800;

    overflow: hidden;

    border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    transition: transform 0.25s ease;
  }

  .switch-track.on .switch-thumb { transform: translateX(20px); }

  /* ==================== CARDS & ADMIN CONTROLS ==================== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
  }

  .card-title { margin: 0 0 10px; font-size: 15px; font-weight: 800; }

  .notice-info-box {
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: #BAE6FD;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.4;
    margin-bottom: 12px;
  }

  html[data-theme="light"] .notice-info-box {
    color: #0369A1;
    background: rgba(14, 165, 233, 0.10);
  }

  .ai-preset-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }

  .ai-preset-chip {
    flex-shrink: 0;
    padding: 6px 11px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-2);
  }

  .banner-preview-box {
    width: 100%;
    height: 130px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border-strong);
    background: #080B14;
    margin-bottom: 12px;
    position: relative;
  }

  .banner-preview-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .empty-state {
    background: var(--surface);
    border: 1px dashed var(--border-strong);
    border-radius: 18px;
    padding: 28px 16px;
    text-align: center;
    color: var(--text-3);
  }

  .empty-state strong {
    display: block;
    color: var(--text);
    font-size: 15px;
    margin-top: 8px;
    margin-bottom: 4px;
  }

  /* ==================== BOTTOM NAV ==================== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 520px;
    z-index: 45;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 6px 6px 8px;
  }

  .nav-btn {
    flex: 1;
    min-height: 50px;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--text-3);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.35px;
    transition: color 0.18s ease, background 0.18s ease;
  }

  .nav-btn.active {
    color: #38BDF8;
    background: rgba(56, 189, 248, 0.12);
  }

  /* ==================== FLOATING CENTER POPUP / MODAL SYSTEM (HIGH-CONTRAST) ==================== */
  .modal-backdrop {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 9000;
    box-sizing: border-box;
    background: rgba(6, 10, 22, 0.72);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 16px 14px 24px;
    opacity: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }

  .modal-sheet {
    position: relative;
    z-index: 2;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    flex: 0 0 auto;
    flex-shrink: 0;
    width: 100%;
    max-width: 480px;
    min-height: 290px;
    height: auto;
    max-height: none;
    margin: auto 0;
    background-color: #111827;
    color: #F8FAFC;
    border: 1.5px solid rgba(56, 189, 248, 0.55);
    border-radius: 20px;
    padding: 0;
    overflow: visible;
    box-shadow: 0 22px 54px rgba(0, 0, 0, 0.68);
    color-scheme: dark;
    --surface: #161E31;
    --surface-2: #1D2740;
    --surface-3: #273454;
    --border: rgba(148, 163, 184, 0.24);
    --border-strong: rgba(148, 163, 184, 0.42);
    --text: #F8FAFC;
    --text-2: #E2E8F0;
    --text-3: #94A3B8;
  }

  .modal-sheet.expanded {
    max-width: 560px;
    min-height: 75vh;
    height: auto;
    max-height: none;
  }

  html[data-theme="light"] .modal-sheet {
    background-color: #FFFFFF;
    color: #0F172A;
    border: 1.5px solid #2563EB;
    color-scheme: light;
    --surface: #FFFFFF;
    --surface-2: #F1F5F9;
    --surface-3: #E2E8F0;
    --border: #CBD5E1;
    --border-strong: #94A3B8;
    --text: #0F172A;
    --text-2: #334155;
    --text-3: #475569;
  }

  .modal-head {
    position: sticky;
    top: 0;
    z-index: 5;
    box-sizing: border-box;
    flex-shrink: 0;
    width: 100%;
    min-height: 54px;
    padding: 10px 14px;
    background-color: #0E1629;
    border-bottom: 1px solid rgba(56, 189, 248, 0.28);
    border-radius: 18px 18px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  html[data-theme="light"] .modal-head {
    background-color: #F8FAFC;
    border-bottom-color: #CBD5E1;
  }

  .modal-back-btn {
    min-height: 36px;
    padding: 0 11px;
    border-radius: 10px;
    background: rgba(56, 189, 248, 0.16);
    border: 1px solid rgba(56, 189, 248, 0.36);
    color: #7DD3FC;
    font-size: 12.5px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }

  html[data-theme="light"] .modal-back-btn {
    color: #1D4ED8;
    background: rgba(37, 99, 235, 0.10);
    border-color: rgba(37, 99, 235, 0.30);
  }

  .modal-title {
    margin: 0;
    flex: 1;
    min-width: 0;
    font-size: 15.5px;
    font-weight: 900;
    text-align: center;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .modal-head-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .modal-expand-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(139, 92, 246, 0.18);
    border: 1px solid rgba(139, 92, 246, 0.42);
    color: #C4B5FD;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 15px;
    flex-shrink: 0;
  }

  html[data-theme="light"] .modal-expand-btn {
    background: #EDE9FE;
    color: #6D28D9;
    border-color: #C4B5FD;
  }

  .modal-close {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background-color: #1E293B;
    border: 1px solid rgba(148, 163, 184, 0.36);
    color: #F8FAFC;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 15px;
    flex-shrink: 0;
  }

  html[data-theme="light"] .modal-close {
    background-color: #E2E8F0;
    color: #0F172A;
    border-color: #CBD5E1;
  }

  .modal-body {
    position: relative;
    box-sizing: border-box;
    display: block;
    flex: 1 0 auto;
    flex-shrink: 0;
    width: 100%;
    min-height: 210px;
    height: auto;
    max-height: none;
    overflow: visible;
    padding: 16px 16px 28px;
    color: var(--text);
    background-color: #111827;
    border-radius: 0 0 18px 18px;
  }

  .modal-sheet.expanded .modal-body {
    max-height: none;
  }

  html[data-theme="light"] .modal-body {
    background-color: #FFFFFF;
  }

  .rx-spinner {
    width: 38px;
    height: 38px;
    margin: 0 auto 12px;
    border-radius: 50%;
    border: 3.5px solid rgba(56, 189, 248, 0.22);
    border-top-color: #38BDF8;
    animation: rxSpin 0.75s linear infinite;
  }

  @keyframes rxSpin {
    to { transform: rotate(360deg); }
  }

  .modal-body .card {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .modal-body .field-label {
    color: #CBD5E1 !important;
    font-weight: 800;
  }

  html[data-theme="light"] .modal-body .field-label {
    color: #334155 !important;
  }

  .modal-body .field-input,
  .modal-body .field-select,
  .modal-body .field-textarea {
    min-height: 48px;
    font-size: 15.5px;
    padding: 11px 14px;
    background-color: #1A233A !important;
    color: #F8FAFC !important;
    -webkit-text-fill-color: #F8FAFC !important;
    border: 1.5px solid #3B4A6B !important;
    border-radius: 13px;
    appearance: none;
    -webkit-appearance: none;
  }

  .modal-body .field-input::placeholder,
  .modal-body .field-textarea::placeholder {
    color: #94A3B8 !important;
    -webkit-text-fill-color: #94A3B8 !important;
    opacity: 1 !important;
  }

  .modal-body .field-input:focus,
  .modal-body .field-select:focus,
  .modal-body .field-textarea:focus {
    border-color: #38BDF8 !important;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25) !important;
  }

  html[data-theme="light"] .modal-body .field-input,
  html[data-theme="light"] .modal-body .field-select,
  html[data-theme="light"] .modal-body .field-textarea {
    background-color: #F8FAFC !important;
    color: #0F172A !important;
    -webkit-text-fill-color: #0F172A !important;
    border: 1.5px solid #94A3B8 !important;
  }

  html[data-theme="light"] .modal-body .field-input::placeholder,
  html[data-theme="light"] .modal-body .field-textarea::placeholder {
    color: #64748B !important;
    -webkit-text-fill-color: #64748B !important;
  }

  .modal-body .btn {
    min-height: 46px;
    font-size: 14px;
  }

  .modal-error-card {
    background: rgba(244, 63, 94, 0.16);
    border: 1.5px solid rgba(244, 63, 94, 0.55);
    border-radius: 16px;
    padding: 18px;
    color: #FFE4E6;
  }

  html[data-theme="light"] .modal-error-card {
    color: #881337;
    background: #FFE4E6;
  }

  @media (max-width: 440px) {
    .modal-body .grid-2 {
      grid-template-columns: 1fr;
    }
  }

  @media (max-height: 540px) {
    .modal-backdrop {
      padding: 8px 8px 18px;
      align-items: center;
    }
    .modal-sheet,
    .modal-sheet.expanded {
      width: 100%;
      max-height: none;
      min-height: 220px;
      border-radius: 18px;
    }
    .modal-body {
      max-height: none;
      min-height: 150px;
      padding: 12px 14px 24px;
    }
  }

  .room-locked-card {
    box-sizing: border-box;
    width: 100%;
    height: auto;
    min-height: 0;
    max-height: none;
    overflow: visible;
    background: var(--surface-2);
    border: 1.5px solid rgba(56, 189, 248, 0.34);
    border-radius: 18px;
    padding: 24px 18px 22px;
    text-align: center;
    color: var(--text);
  }

  .room-lock-badge {
    width: 68px;
    height: 68px;
    flex-shrink: 0;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: rgba(37, 99, 235, 0.16);
    border: 1.5px solid rgba(56, 189, 248, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(135deg, #2563EB, #1D4ED8);

    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 8px 22px rgba(37, 99, 235, 0.42);
    cursor: pointer;
  }

  .room-row-box {
    background: var(--surface-2);
    border: 1.5px solid rgba(56, 189, 248, 0.4);
    border-radius: 16px;
    padding: 13px 14px;
    margin-bottom: 12px;
    color: var(--text);
  }

  .room-row-box.pass-box {
    border-color: rgba(167, 139, 250, 0.44);
  }

  .room-row-label {
    font-size: 11.5px;
    font-weight: 900;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    color: #38BDF8;

    display: flex;
    align-items: center;
    gap: 6px;
  }

  .room-row-box.pass-box .room-row-label {

  }

  .room-row-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

  .room-row-value {

    font-weight: 900;
    letter-spacing: 0.6px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 11px;
    padding: 10px 12px;
    word-break: break-all;
    user-select: all;
  }

  .room-copy-btn {
    flex-shrink: 0;
    min-height: 44px;
    padding: 0 14px;
    border-radius: 11px;
    background: linear-gradient(135deg, #2563EB, #0284C7);
    color: #FFFFFF;
    font-size: 12.5px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;

  }

  .room-row-box.pass-box .room-copy-btn {
    background: linear-gradient(135deg, #7C3AED, #6D28D9);
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.35);
  }

  .room-copy-btn:active { transform: scale(0.97); }

  .room-cred-box {
    background: var(--surface);
    border: 1.5px solid rgba(56, 189, 248, 0.36);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    color: var(--text);
  }

  .room-cred-val {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

(function() {

  // ==================== SHA-256 (ZERO-DEPENDENCY, WORKS OFFLINE/FILE://) ====================
  function sha256(ascii) {
    function rightRotate(value, amount) {
      return (value >>> amount) | (value << (32 - amount));
    }
    var mathPow = Math.pow;
    var maxWord = mathPow(2, 32);
    var lengthProperty = "length";
    var i, j;
    var result = "";
    var words = [];
    var asciiBitLength = ascii[lengthProperty] * 8;
    var hash = sha256.h = sha256.h || [];
    var k = sha256.k = sha256.k || [];
    var primeCounter = k[lengthProperty];
    var isComposite = {};
    for (var candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
        hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    ascii += "\x80";
    while (ascii[lengthProperty] % 64 - 56) ascii += "\x00";
    for (i = 0; i < ascii[lengthProperty]; i++) {
      j = ascii.charCodeAt(i);
      if (j >> 8) return "";
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
    words[words[lengthProperty]] = (asciiBitLength);
    for (j = 0; j < words[lengthProperty];) {
      var w = words.slice(j, j += 16);
      var oldHash = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2];
        var a = hash[0], e = hash[4];
        var temp1 = hash[7]
          + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
          + ((e & hash[5]) ^ ((~e) & hash[6]))
          + k[i]
          + (w[i] = (i < 16) ? w[i] : (
              w[i - 16]
              + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
              + w[i - 7]
              + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
            ) | 0
          );
        var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
          + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(temp1 + temp2) | 0].concat(hash);
        hash[4] = (hash[4] + temp1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }
    for (i = 0; i < 8; i++) {
      for (j = 3; j + 1; j--) {
        var b = (hash[i] >> (j * 8)) & 255;
        result += ((b < 16) ? 0 : "") + b.toString(16);
      }
    }
    return result;
  }

  // Verified hash of locked Super Admin identity (never expose plaintext in UI or source)
  var SUPER_ADMIN_DIGEST = "74c23c019d88446b83ad4cc103a5e3df076c5cf082a65e124d77f52b0b58259b";

    var norm = normalizeEmail(email);
    if (!norm) return false;
    return sha256(norm) === SUPER_ADMIN_DIGEST;

  // ==================== FAULT-TOLERANT STORAGE ENGINE ====================
  var STORAGE_KEY = "rx_tour_bd_state_v1";
  var memoryFallback = {};
  var storageWorks = (function() {
    try {

      return true;
    } catch (e) {
      return false;
    }
  })();

  function safeReadRaw() {
    try {
      if (storageWorks) {
        return window.localStorage.getItem(STORAGE_KEY);
      }
    } catch (e) {}
    return memoryFallback[STORAGE_KEY] || null;
  }

  function safeWriteRaw(str) {
    memoryFallback[STORAGE_KEY] = str;
    try {
      if (storageWorks) {
        window.localStorage.setItem(STORAGE_KEY, str);
      }
    } catch (e) {}
  }

  // ==================== CONSTANTS & MODE DEFINITIONS ====================
  var MODES = [
    { id: "BR Match", name: "BR Match", badge: "BR MATCH", img: "img_match_thumb.jpg", aliases: ["BR Match"], c1: "#EA580C", c2: "#9A3412" },
    { id: "BR Survival", name: "BR Survival Match", badge: "BR SURVIVAL", img: "img_cat_br_survival.jpg", aliases: ["BR Survival", "BR Survival Match"], c1: "#0284C7", c2: "#0F172A" },
    { id: "E-Sports Mode", name: "E-Sports Mode", badge: "E-SPORTS MODE", img: "img_cat_esports.jpg", aliases: ["E-Sports Mode", "E-Sports", "E-Sports Match"], c1: "#D97706", c2: "#7C2D12" },
    { id: "Lone Wolf", name: "Lone Wolf", badge: "LONE WOLF", aliases: ["Lone Wolf"], c1: "#4F46E5", c2: "#1E1B4B" },
    { id: "LW Survival", name: "LW Survival", badge: "LW SURVIVAL", aliases: ["LW Survival", "Lone Wolf Survival"], c1: "#0EA5E9", c2: "#082F49" },
    { id: "Clash Squad", name: "Clash Squad", badge: "CLASH SQUAD", aliases: ["Clash Squad"], c1: "#E11D48", c2: "#881337" },
    { id: "CS 2v2", name: "CS 2v2", badge: "CS 2v2", aliases: ["CS 2v2"], c1: "#0284C7", c2: "#0C4A6E" },
    { id: "LW Headshot", name: "LW Headshot", badge: "LW HEADSHOT", aliases: ["LW Headshot"], c1: "#BE123C", c2: "#4C0519" }
  ];

  function isRemovedTournamentMode(modeOrId) {
    var raw = String(modeOrId || "").trim().toLowerCase();
    if (!raw) return false;
    return raw === "br max" ||
      raw === "br max match" ||
      raw === "katana vs katana" ||
      raw === "katana vs katana match" ||
      raw === "katana";
  }

  function getModeMeta(modeId) {
    return MODES.find(function(md) {
      if (md.id === modeId || md.name === modeId) return true;
      return Array.isArray(md.aliases) && md.aliases.indexOf(modeId) >= 0;
    }) || { id: modeId, name: modeId, badge: String(modeId || "").toUpperCase(), aliases: [modeId] };
  }

  function matchBelongsToMode(m, modeId) {
    if (!m || !m.mode) return false;
    var meta = getModeMeta(modeId);
    if (m.mode === meta.id || m.mode === meta.name) return true;
    return Array.isArray(meta.aliases) && meta.aliases.indexOf(m.mode) >= 0;
  }

  function getModeMatches(modeId) {
    return state.matches.filter(function(m) {
      return matchBelongsToMode(m, modeId);
    });
  }

  var GLOBAL_LOGO_BRIDGE_KEY = "__GLOBAL_LOGO__";

  function isSafeLogoSrc(src) {
    if (!src || typeof src !== "string") return false;
    var trimmed = src.trim();
    if (/^img_[a-z0-9_]+\.(png|jpe?g|webp)(\?v=\d+)?$/i.test(trimmed)) return true;
    if (/^data:image\/(png|jpeg|jpg|webp);base64,[A-Za-z0-9+/=\s]+$/i.test(trimmed)) return true;
    return false;
  }

  function getGlobalLogoInfo() {
    var gl = (typeof state !== "undefined" && state && state.config && state.config.globalLogo)
      ? state.config.globalLogo

    if (gl && gl.dataUrl && isSafeLogoSrc(gl.dataUrl)) {
      return {

        src: gl.dataUrl,
        mimeType: gl.mimeType || "image/png",
        fileName: gl.fileName || "global-logo",
        version: Number(gl.version || gl.updatedAt || 1),

    return {
      isCustom: false,
      src: "",
      mimeType: "",
      fileName: "",
      version: 0,
      updatedAt: 0

  function renderBrandEmblemMarkup(imgClass, svgSize, gradId) {
    var gl = getGlobalLogoInfo();

  function getAllTournamentCategories() {
    var list = [];
    var seenIds = Object.create(null);
    function pushCat(cat) {
      if (!cat || !cat.id || cat.id === GLOBAL_LOGO_BRIDGE_KEY) return;
      if (isRemovedTournamentMode(cat.id) || isRemovedTournamentMode(cat.name)) return;
      if (seenIds[cat.id]) return;
      seenIds[cat.id] = true;
      list.push(cat);

    MODES.forEach(function(md) { pushCat(md); });

    if (typeof state !== "undefined" && state) {
      if (Array.isArray(state.customModes)) {
        state.customModes.forEach(function(cm) {
          if (cm && cm.id && !isRemovedTournamentMode(cm.id) && !isRemovedTournamentMode(cm.name)) {

              id: String(cm.id),

              img: isSafeLogoSrc(cm.img) ? cm.img : "",

              c1: cm.c1 || "#0EA5E9",
              c2: cm.c2 || "#0F172A"

            id: meta.id,
            name: meta.name || meta.id,
            badge: meta.badge || String(meta.id).toUpperCase(),

            aliases: meta.aliases || [meta.id],

            c2: meta.c2 || "#0F172A"

        Object.keys(state.categoryLogos).forEach(function(cid) {
          if (cid === GLOBAL_LOGO_BRIDGE_KEY || isRemovedTournamentMode(cid)) return;
          var meta = getModeMeta(cid);
          pushCat({
            id: meta.id,
            name: meta.name || meta.id,
            badge: meta.badge || String(meta.id).toUpperCase(),
            img: meta.img || "",
            aliases: meta.aliases || [meta.id],
            c1: meta.c1 || "#0284C7",
            c2: meta.c2 || "#0F172A"
          });
        });
      }
    }
    return list;
  }

  function getCategoryLogoInfo(catOrId, opts) {
    var cfg = opts || {};
    var catId = typeof catOrId === "string" ? catOrId : (catOrId && catOrId.id ? catOrId.id : "");
    var meta = getModeMeta(catId);
    var map = (typeof state !== "undefined" && state && state.categoryLogos) ? state.categoryLogos : {};
    var saved = map[meta.id] || map[catId] || null;
    if (!cfg.ignoreCategoryOverride && saved && saved.dataUrl && isSafeLogoSrc(saved.dataUrl)) {
      return {
        categoryId: meta.id,
        isCustom: true,
        isGlobal: false,
        src: saved.dataUrl,
        mimeType: saved.mimeType || "image/png",
        fileName: saved.fileName || "",
        version: Number(saved.version || saved.updatedAt || 1),
        updatedAt: Number(saved.updatedAt || 0)

    var gl = getGlobalLogoInfo();
    if (!cfg.ignoreGlobal && gl.isCustom && gl.src) {
      return {
        categoryId: meta.id,
        isCustom: true,
        isGlobal: true,
        src: gl.src,
        mimeType: gl.mimeType,
        fileName: gl.fileName,
        version: gl.version,
        updatedAt: gl.updatedAt
      };
    }
    var defaultImg = (typeof catOrId === "object" && catOrId && catOrId.img) ? catOrId.img : (meta.img || "");
    return {
      categoryId: meta.id,
      isCustom: false,
      isGlobal: false,
      src: isSafeLogoSrc(defaultImg) ? defaultImg : "",
      mimeType: "",
      fileName: "",
      version: 0,
      updatedAt: 0

  function resolveMatchLogoSrc(m) {
    var modeId = m && m.mode ? m.mode : "BR Match";

  function trimTransparentCanvasMargins(srcCanvas, cw, ch) {
    try {
      var sCtx = srcCanvas.getContext("2d");
      if (!sCtx) return srcCanvas;
      var imgData = sCtx.getImageData(0, 0, cw, ch);
      var data = imgData.data;
      var minX = cw, minY = ch, maxX = -1, maxY = -1;
      for (var y = 0; y < ch; y++) {
        var rowOff = y * cw * 4;
        for (var x = 0; x < cw; x++) {
          if (data[rowOff + x * 4 + 3] > 12) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }

      var cropW = maxX - minX + 1;
      var cropH = maxY - minY + 1;
      if (cropW >= cw * 0.94 && cropH >= ch * 0.94) return srcCanvas;
      var pad = Math.max(2, Math.round(Math.max(cropW, cropH) * 0.02));
      var sx = Math.max(0, minX - pad);
      var sy = Math.max(0, minY - pad);
      var ex = Math.min(cw - 1, maxX + pad);
      var ey = Math.min(ch - 1, maxY + pad);
      var tw = Math.max(1, ex - sx + 1);
      var th = Math.max(1, ey - sy + 1);
      var outCanvas = document.createElement("canvas");
      outCanvas.width = tw;
      outCanvas.height = th;
      var oCtx = outCanvas.getContext("2d");
      if (!oCtx) return srcCanvas;
      oCtx.drawImage(srcCanvas, sx, sy, tw, th, 0, 0, tw, th);
      return outCanvas;
    } catch (e) {
      return srcCanvas;
    }
  }

  function validateAndReadLogoFile(file, onSuccess, onError) {
    if (!file) {
      if (onError) onError("No image file selected.");
      return;
    }
    var fileName = String(file.name || "");
    var rawType = String(file.type || "").toLowerCase();
    var validMime = /^image\/(png|jpe?g|webp)$/.test(rawType);
    var validExt = /\.(png|jpe?g|webp)$/i.test(fileName);
    if (!validMime && !validExt) {
      if (onError) onError("Only PNG, JPG, JPEG, and WEBP image files are supported.");
      return;
    }
    if (rawType && !validMime) {
      if (onError) onError("Unsupported file format. Please upload PNG, JPG, JPEG, or WEBP.");
      return;
    }
    if (typeof file.size === "number" && file.size > 15 * 1024 * 1024) {
      if (onError) onError("Image file is too large (max 15 MB).");
      return;

        return;

        return;

          var maxDim = 512;
          var w = img.width || maxDim;
          var h = img.height || maxDim;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));

          canvas.width = cw;
          canvas.height = ch;

        }

      img.onerror = function() {

  function readAndResizeImage(file, maxWidth, callback) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      var img = new Image();
      img.onload = function() {
        try {
          var scale = img.width > maxWidth ? (maxWidth / img.width) : 1;
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL("image/jpeg", 0.82));
        } catch (err) {
          callback(ev.target.result);
        }
      };
      img.onerror = function() { callback(ev.target.result); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

      var byId = !!(uid && p.userId && p.userId === uid);
      var byEmail = !!(uEmail && p.email && normalizeEmail(p.email) === uEmail);
      return byId || byEmail;
    });
  }

  function fetchAuthorizedRoomCredentials(user, matchId) {
    if (!user || !matchId) return { authorized: false, joined: false };
    var m = (state.matches || []).find(function(x) { return x.id === matchId; });
    if (!m) return { authorized: false, joined: false };

    // Verify join record strictly by User ID + Match ID + Session Email
    var joined = verifyUserJoinedMatch(user, m);
    if (!joined) {
      return { authorized: false, joined: false };
    }

    // Consult Android native Room Vault backend if running inside WebView APK
    try {
      if (window.RxAndroidBridge && typeof window.RxAndroidBridge.getAuthorizedRoomCredentials === "function") {
        window.RxAndroidBridge.saveMatchRoomVault(m.id, m.roomId || "", m.roomPass || "");
        window.RxAndroidBridge.registerVerifiedJoin(user.id || "", normalizeEmail(user.email || ""), m.id);
        var raw = window.RxAndroidBridge.getAuthorizedRoomCredentials(user.id || "", normalizeEmail(user.email || ""), m.id);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (!parsed || !parsed.authorized) {
            return { authorized: false, joined: false };
          }
          return {
            authorized: true,
            joined: true,
            matchId: m.id,
            roomId: String(parsed.roomId || ""),
            roomPass: String(parsed.roomPass || "")
          };
        }
      }
    } catch (e) {}

    return {
      authorized: true,
      joined: true,
      matchId: m.id,
      roomId: String(m.roomId || ""),
      roomPass: String(m.roomPass || "")
    };
  }

  function isSubAdminEmail(email) {
    var norm = normalizeEmail(email);
    if (!norm || isSuperAdminEmail(norm)) return false;
    return state.subAdmins.some(function(s) { return normalizeEmail(s.email) === norm; });
  }

  function getUserRole(email) {
    if (isSuperAdminEmail(email)) return "SUPER_ADMIN";
    if (isSubAdminEmail(email)) return "SUB_ADMIN";
    return "PLAYER";
  }

  function isCurrentUserSuperAdmin() {
    var u = getCurrentUser();
    return u ? isSuperAdminEmail(u.email) : false;
  }

  function isCurrentUserAdmin() {
    var u = getCurrentUser();
    if (!u) return false;
    var role = getUserRole(u.email);
    return role === "SUPER_ADMIN" || role === "SUB_ADMIN";
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function formatMoney(n) {
    var num = Number(n || 0);
    return num.toLocaleString("en-US", { maximumFractionDigits: 0 });
  }

  function formatDateTime(ts) {
    try {
      var d = new Date(ts);
      return d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    } catch (e) {
      return "";
    }
  }

  function generateReferralCode(name) {
    var prefix = (String(name || "RX").replace(/[^A-Za-z]/g, "").slice(0, 2) || "RX").toUpperCase();
    var num = Math.floor(1000 + Math.random() * 9000);
    return prefix + num;
  }

  var NOTIF_CATEGORIES = [
    { id: "ADMIN", label: "Admin Announcement", icon: "📢" },
    { id: "MATCH_UPCOMING", label: "Match Upcoming", icon: "📅" },
    { id: "MATCH_STARTED", label: "Match Started", icon: "🔥" },
    { id: "ROOM_ID", label: "Room ID Published", icon: "🔑" },
    { id: "ROOM_PASS", label: "Room Password Published", icon: "🔒" },
    { id: "MATCH_RESULT", label: "Match Result", icon: "🏆" },
    { id: "MATCH_CANCELLED", label: "Match Cancelled", icon: "❌" },
    { id: "DEPOSIT", label: "Deposit Successful", icon: "💳" },
    { id: "WITHDRAW", label: "Withdraw Update", icon: "💸" },
    { id: "PAYMENT", label: "Payment Notification", icon: "🪙" },
    { id: "ACCOUNT", label: "Account Notification", icon: "👤" },
    { id: "OTHER", label: "Other Notifications", icon: "🔔" }
  ];

  function inferNotificationCategory(n) {
    if (n && n.category && NOTIF_CATEGORIES.some(function(c) { return c.id === n.category; })) {
      return n.category;
    }
    var t = ((n && n.title) || "").toLowerCase();
    var m = ((n && n.message) || "").toLowerCase();
    var s = t + " " + m;
    if (s.indexOf("room password") !== -1) return "ROOM_PASS";
    if (s.indexOf("room id") !== -1 || s.indexOf("room credentials") !== -1) return "ROOM_ID";
    if (s.indexOf("match cancelled") !== -1 || s.indexOf("cancelled") !== -1) return "MATCH_CANCELLED";
    if (s.indexOf("match started") !== -1 || s.indexOf("has started") !== -1) return "MATCH_STARTED";
    if (s.indexOf("result") !== -1 || s.indexOf("prize credited") !== -1 || s.indexOf("won ") !== -1) return "MATCH_RESULT";
    if (s.indexOf("deposit") !== -1) return "DEPOSIT";
    if (s.indexOf("withdraw") !== -1) return "WITHDRAW";
    if (s.indexOf("joined") !== -1 || s.indexOf("upcoming") !== -1 || s.indexOf("schedule") !== -1) return "MATCH_UPCOMING";
    if (s.indexOf("wallet") !== -1 || s.indexOf("bonus") !== -1 || s.indexOf("referral") !== -1 || s.indexOf("entry fee") !== -1 || s.indexOf("refund") !== -1) return "PAYMENT";
    if (s.indexOf("welcome") !== -1 || s.indexOf("profile") !== -1 || s.indexOf("sub-admin") !== -1 || s.indexOf("account") !== -1) return "ACCOUNT";
    if (n && (n.telegramUrl || n.imageDataUrl || n.fullText !== n.message)) return "ADMIN";
    return "OTHER";
  }

  function getNotificationMeta(n) {
    var catId = inferNotificationCategory(n);
    var found = NOTIF_CATEGORIES.find(function(c) { return c.id === catId; }) || NOTIF_CATEGORIES[NOTIF_CATEGORIES.length - 1];
    return found;
  }

  function pushNotification(userEmail, title, message, kind, meta) {
    var extra = meta && typeof meta === "object" ? meta : {};
    var tempObj = { title: title, message: message, category: extra.category || "", telegramUrl: extra.telegramUrl, imageDataUrl: extra.imageDataUrl, fullText: extra.fullText };
    var resolvedCategory = inferNotificationCategory(tempObj);
    state.notifications.unshift({
      id: "ntf_" + Date.now() + "_" + Math.floor(Math.random() * 9999),
      userEmail: normalizeEmail(userEmail),
      title: title,
      message: message,
      fullText: extra.fullText || message || "",
      imageDataUrl: extra.imageDataUrl || "",
      telegramUrl: extra.telegramUrl || "",
      buttonText: extra.buttonText || "",
      category: resolvedCategory,
      kind: kind || "info",
      read: false,
      createdAt: getServerNow()
    });
  }

  function pushTransaction(userEmail, type, amount, note, status) {
    state.transactions.unshift({
      id: "tx_" + Date.now() + "_" + Math.floor(Math.random() * 9999),
      userEmail: normalizeEmail(userEmail),
      type: type,
      amount: Number(amount),
      note: note,
      status: status || "COMPLETED",
      createdAt: Date.now()
    });
  }

  // ==================== TOAST ====================
  function showToast(msg, type) {
    var wrap = document.getElementById("toastWrap");
    if (!wrap) return;
    var t = type || "info";
    var icon = t === "success" ? "&#9989;" : (t === "error" ? "&#9888;" : "&#8505;");
    var el = document.createElement("div");
    el.className = "toast-item " + t;
    el.innerHTML = '<span style="flex-shrink:0;">' + icon + '</span><span style="flex:1;">' + escapeHtml(msg) + '</span>';
    el.onclick = function() {
      if (el.parentNode) el.parentNode.removeChild(el);
    };
    wrap.appendChild(el);
    setTimeout(function() {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 3400);
  }

  window.handleSignup = function(e) {
    e.preventDefault();
    var name = document.getElementById("signupName").value.trim();
    var email = normalizeEmail(document.getElementById("signupEmail").value);
    var password = document.getElementById("signupPassword").value;
    var refInput = document.getElementById("signupReferral").value.trim().toUpperCase();

    if (name.length < 2) {
      showAuthBanner("Please enter your full name.", "error");
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showAuthBanner("Please enter a valid email address.", "error");
      return;
    }
    if (password.length < 4) {
      showAuthBanner("Password must be at least 4 characters.", "error");
      return;
    }
    var exists = state.users.some(function(u) { return normalizeEmail(u.email) === email; });
    if (exists) {
      showAuthBanner("An account with this email already exists. Please log in.", "error");
      return;
    }

    var newUser = {
      id: "u_" + Date.now(),
      name: name,
      email: email,
      password: password,
      phone: "",
      defaultIgn: "",
      balance: 0,
      totalDeposited: 0,
      totalWithdrawn: 0,
      totalWon: 0,
      totalKills: 0,
      matchesPlayed: 0,
      referralCode: generateReferralCode(name),
      referredBy: "",
      createdAt: Date.now()
    };

    if (refInput) {
      var referrer = state.users.find(function(u) { return String(u.referralCode || "").toUpperCase() === refInput; });
      if (referrer) {
        var reward = Number(state.config.inviteRewardAmount || 0);
        newUser.referredBy = referrer.email;
        if (reward > 0) {
          referrer.balance = Number(referrer.balance || 0) + reward;
          pushTransaction(referrer.email, "REFERRAL_BONUS", reward, "Referral bonus from " + name, "COMPLETED");
          pushNotification(referrer.email, "Referral Bonus Credited", "You earned ৳" + reward + " because " + name + " joined using your invite code!", "success", { category: "PAYMENT" });
        }
      }
    }

    state.users.push(newUser);
    pushNotification(newUser.email, "Welcome to RX TOUR BD!", "Your tournament account is ready. Join any mode from Home.", "info", { category: "ACCOUNT" });
    saveState();

    // Reset signup inputs, pre-fill login email, clear login password, slide smoothly to Login
    document.getElementById("signupForm").reset();
    document.getElementById("loginEmail").value = email;
    document.getElementById("loginPassword").value = "";
    window.switchAuthPane("login");
    showAuthBanner("Account created! Please log in with your email and password.", "success");
  };

  window.handleLogin = function(e) {
    e.preventDefault();
    var email = normalizeEmail(document.getElementById("loginEmail").value);
    var password = document.getElementById("loginPassword").value;

    if (!email || !password) {
      showAuthBanner("Please enter both email and password.", "error");
      return;
    }
    var user = state.users.find(function(u) { return normalizeEmail(u.email) === email; });
    if (!user || user.password !== password) {
      showAuthBanner("Invalid email or password. Please check your credentials.", "error");
      return;
    }

    state.sessionEmail = email;
    saveState();
    showAuthBanner("", "");
    document.getElementById("loginPassword").value = "";
    ui.activeTab = "home";
    ui.selectedMode = null;
    ui.selectedMatchId = null;
    renderApp();
    showToast("Welcome back, " + user.name + "!", "success");
  };

  window.handleLogout = function() {
    state.sessionEmail = null;
    saveState();
    closeAllModals();
    ui.selectedMode = null;
    ui.selectedMatchId = null;
    ui.activeTab = "home";
    renderApp();
    window.switchAuthPane("login");
    showAuthBanner("You have logged out securely.", "success");
  };

  function renderMatchPlayersTab(user, m) {
    var participants = normalizeMatchParticipants(m);
    var totalSlots = Math.max(1, Number(m.totalSlots || 48));
    var joinedCount = participants.length;
    var spotsLeft = Math.max(0, totalSlots - joinedCount);
    var userJoined = participants.find(function(p) {
      return verifyUserJoinedMatch(user, { id: m.id, participants: [p] });
    });

    if (!userJoined) {
      var canJoin = m.status === "UPCOMING" && spotsLeft > 0;
      return '<div class="card" style="text-align:center;padding:24px 16px;">' +
        '<div style="font-size:38px;margin-bottom:8px;">&#128274;</div>' +
        '<div style="font-size:16.5px;font-weight:900;color:var(--text);margin-bottom:6px;">আপনি এখনো এই ম্যাচে Join করেননি।</div>' +
        '<div style="font-size:13px;color:var(--text-3);line-height:1.55;margin-bottom:16px;">' +
          (canJoin
            ? 'Join Match বাটনে ক্লিক করে আপনার Name ও In-Game UID দিয়ে স্লট বুক করুন। Join করলে সম্পূর্ণ ১–' + totalSlots + ' প্লেয়ার লিস্ট দেখতে পারবেন।'
            : ('Registration is currently closed (' + escapeHtml(spotsLeft <= 0 && m.status === "UPCOMING" ? "MATCH FULL" : m.status) + ').')) +
        '</div>' +
        (canJoin
          ? '<button type="button" class="btn btn-primary btn-block" onclick="openJoinModal(\'' + escapeHtml(m.id) + '\')">&#9876; Join Match</button>'
          : '') +
      '</div>';
    }

    var slotMap = Object.create(null);
    participants.forEach(function(p) {
      if (p.slot >= 1 && p.slot <= totalSlots && !slotMap[p.slot]) {
        slotMap[p.slot] = p;
      }
    });

    var slotRowsHtml = "";
    for (var s = 1; s <= totalSlots; s++) {
      var occupant = slotMap[s] || null;
      if (occupant) {
        var isSelf = verifyUserJoinedMatch(user, { id: m.id, participants: [occupant] });
        var displayName = occupant.ign || occupant.name || "Player";
        var displayUid = occupant.uid ? ("UID: " + occupant.uid) : "UID: Not provided";
        slotRowsHtml += '<div class="slot-row occupied ' + (isSelf ? "self-slot" : "") + '">' +
          '<div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;">' +
            '<div class="slot-num-pill">#' + s + '</div>' +
            '<div style="min-width:0;flex:1;">' +
              '<div style="font-size:13.5px;font-weight:800;color:var(--text);word-break:break-word;">' +
                escapeHtml(displayName) + (isSelf ? '<span class="slot-you-pill">YOU</span>' : '') +
              '</div>' +
              '<div style="font-size:11.5px;color:#38BDF8;font-weight:700;margin-top:2px;">' + escapeHtml(displayUid) + '</div>' +
            '</div>' +
          '</div>' +
          '<span style="font-size:11px;font-weight:800;color:#4ADE80;flex-shrink:0;">JOINED</span>' +
        '</div>';
      } else {
        slotRowsHtml += '<div class="slot-row available">' +
          '<div style="display:flex;align-items:center;gap:10px;">' +
            '<div class="slot-num-pill">#' + s + '</div>' +
            '<span style="font-size:13px;font-weight:700;color:var(--text-3);">Available</span>' +
          '</div>' +
          '<span class="slot-avail-pill">Available</span>' +
        '</div>';
      }
    }

    var leaveBtnHtml = m.status === "UPCOMING"
      ? '<button type="button" class="btn btn-danger btn-sm" style="min-height:34px;padding:0 10px;font-size:11.5px;" onclick="confirmLeaveMatch(\'' + escapeHtml(m.id) + '\')">Leave Match</button>'
      : '';

    return '<div class="card">' +
      '<div class="section-head" style="margin:0 0 10px;">' +
        '<div>' +
          '<h3 class="card-title" style="margin:0;">&#128101; Player Slots (1 - ' + totalSlots + ')</h3>' +
          '<div style="font-size:12px;color:var(--text-3);margin-top:2px;">Your Slot: <strong style="color:#4ADE80;">#' + Number(userJoined.slot) + '</strong> &bull; Registered: <strong>' + joinedCount + '/' + totalSlots + '</strong></div>' +
        '</div>' +
        leaveBtnHtml +
      '</div>' +
      '<div style="font-size:11.5px;color:var(--text-3);margin-bottom:10px;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);">&#128274; Privacy Protected: Showing Player Name &amp; In-Game UID only.</div>' +
      '<div class="slot-roster-grid">' + slotRowsHtml + '</div>' +
    '</div>';
  }

  window.confirmMatchJoin = function(e, matchId) {
    if (e && e.preventDefault) e.preventDefault();
    var user = getCurrentUser();
    var m = state.matches.find(function(x) { return x.id === matchId; });
    if (!user || !m) return;

    var ign = document.getElementById("joinIgnInput").value.trim();
    var uid = (document.getElementById("joinUidInput") ? document.getElementById("joinUidInput").value.trim() : "");
    if (!ign) {
      showToast("Please enter your Player Name / IGN.", "error");
      return;
    }
    if (!uid || uid.length < 4) {
      showToast("Please enter your valid In-Game UID.", "error");
      return;
    }

    normalizeMatchParticipants(m);
    if (verifyUserJoinedMatch(user, m)) {
      showToast("You have already joined this match.", "error");
      closeModal();
      return;
    }
    var dupUid = (m.participants || []).some(function(p) {
      return p.uid && String(p.uid).trim().toLowerCase() === uid.toLowerCase();
    });
    if (dupUid) {
      showToast("This In-Game UID is already registered in this match.", "error");
      return;
    }

    var assignedSlot = assignNextAvailableSlot(m);
    if (!assignedSlot || (m.participants || []).length >= Number(m.totalSlots)) {
      showToast("Sorry, this match is already full.", "error");
      closeModal();
      return;
    }
    var fee = Number(m.entryFee || 0);
    if (Number(user.balance) < fee) {
      showToast("Insufficient balance! Please deposit first.", "error");
      return;
    }

    user.balance = Number(user.balance) - fee;
    user.matchesPlayed = Number(user.matchesPlayed || 0) + 1;
    if (!user.defaultIgn) user.defaultIgn = ign;
    if (!user.defaultUid) user.defaultUid = uid;
    m.participants.push({
      userId: user.id,
      matchId: m.id,
      email: normalizeEmail(user.email),
      name: user.name,
      ign: ign,
      uid: uid,
      slot: assignedSlot,
      status: "JOINED",
      joinedAt: Date.now()
    });
    normalizeMatchParticipants(m);
    try {
      if (window.RxAndroidBridge && typeof window.RxAndroidBridge.registerVerifiedJoin === "function") {
        window.RxAndroidBridge.registerVerifiedJoin(user.id || "", normalizeEmail(user.email), m.id);
      }
    } catch (errBridge) {}

    pushTransaction(user.email, "MATCH_ENTRY", -fee, "Joined " + getDynamicMatchTitle(m) + " (" + ign + " • Slot #" + assignedSlot + ")", "COMPLETED");
    pushNotification(user.email, "Match Joined! Slot #" + assignedSlot, "You joined " + getDynamicMatchTitle(m) + " as " + ign + " (UID: " + uid + "). Entry fee ৳" + fee + " deducted.", "success", { category: "MATCH_UPCOMING" });
    saveState();
    closeModal();
    renderApp();
    showToast("Joined! Assigned Slot #" + assignedSlot, "success");
  };

  window.confirmLeaveMatch = function(matchId) {
    var user = getCurrentUser();
    var m = state.matches.find(function(x) { return x.id === matchId; });
    if (!user || !m) return;
    if (m.status !== "UPCOMING") {
      showToast("Cannot leave after match has " + m.status + ".", "error");
      return;
    }
    openConfirmModal({
      title: "Leave Match",
      message: "Leave " + getDynamicMatchTitle(m) + " and refund ৳" + formatMoney(m.entryFee) + " back to your wallet?",
      confirmText: "Yes, Leave Match",
      cancelText: "Stay",
      danger: true,
      onConfirm: function() {
        var curUser = getCurrentUser();
        var targetMatch = state.matches.find(function(x) { return x.id === matchId; });
        if (!curUser || !targetMatch || targetMatch.status !== "UPCOMING") return;
        var before = (targetMatch.participants || []).length;
        targetMatch.participants = (targetMatch.participants || []).filter(function(p) {
          return !verifyUserJoinedMatch(curUser, { id: targetMatch.id, participants: [p] });
        });
        if (targetMatch.participants.length < before) {
          var fee = Number(targetMatch.entryFee || 0);
          curUser.balance = Number(curUser.balance) + fee;
          curUser.matchesPlayed = Math.max(0, Number(curUser.matchesPlayed || 1) - 1);
          pushTransaction(curUser.email, "MATCH_REFUND", fee, "Left " + getDynamicMatchTitle(targetMatch) + " (Slot released)", "COMPLETED");
          pushNotification(curUser.email, "Match Entry Cancelled", "You left " + getDynamicMatchTitle(targetMatch) + ". ৳" + fee + " refunded to wallet.", "info", { category: "MATCH_UPCOMING" });
          saveState();
          renderApp();
          showToast("Left match & refunded ৳" + formatMoney(fee), "info");
        }
      }
    });
  };

  window.submitDeposit = function(e) {
    e.preventDefault();
    var user = getCurrentUser();
    if (!user) return;
    var method = document.getElementById("depMethod").value;
    var amount = Number(document.getElementById("depAmount").value);
    var phone = document.getElementById("depPhone").value.trim();
    var trx = document.getElementById("depTrx").value.trim();
    if (amount < 10 || !phone || !trx) {
      showToast("Please fill valid deposit details.", "error");
      return;
    }
    state.deposits.unshift({
      id: "dep_" + Date.now(),
      userEmail: normalizeEmail(user.email),
      userName: user.name,
      method: method,
      amount: amount,
      phone: phone,
      trxId: trx,
      status: "PENDING",
      createdAt: Date.now()
    });
    pushTransaction(user.email, "DEPOSIT_PENDING", amount, method + " TrxID: " + trx + " (Pending)", "PENDING");
    pushNotification(user.email, "Deposit Request Submitted", "Your ৳" + amount + " " + method + " deposit is awaiting admin verification.", "info", { category: "DEPOSIT" });
    saveState();
    renderApp();
    openWalletModal("history");
    showToast("Deposit request submitted!", "success");
  };

  window.submitWithdraw = function(e) {
    e.preventDefault();
    var user = getCurrentUser();
    if (!user) return;
    var method = document.getElementById("wdMethod").value;
    var amount = Number(document.getElementById("wdAmount").value);
    var phone = document.getElementById("wdPhone").value.trim();
    if (amount < 50) {
      showToast("Minimum withdrawal is ৳50.", "error");
      return;
    }
    if (Number(user.balance) < amount) {
      showToast("Insufficient wallet balance.", "error");
      return;
    }
    user.balance = Number(user.balance) - amount;
    state.withdrawals.unshift({
      id: "wd_" + Date.now(),
      userEmail: normalizeEmail(user.email),
      userName: user.name,
      method: method,
      amount: amount,
      phone: phone,
      status: "PENDING",
      createdAt: Date.now()
    });
    pushTransaction(user.email, "WITHDRAW_HOLD", -amount, method + " to " + phone + " (Pending)", "PENDING");
    pushNotification(user.email, "Withdrawal Requested", "৳" + amount + " withdrawal via " + method + " is pending review.", "info", { category: "WITHDRAW" });
    saveState();
    renderApp();
    openWalletModal("history");
    showToast("Withdrawal request submitted!", "success");
  };

                '<span class="notif-type-pill">' + meta.icon + ' ' + escapeHtml(meta.label) + '</span>' +

    var uidEl = document.getElementById("epUid");

  function fixedRankLabel(idx) {
    if (idx === 0) return "1st Position";
    if (idx === 1) return "2nd Position";
    if (idx === 2) return "3rd Position";
    return (idx + 1) + "th Position";
  }

  function getFixedPrizeModeConfig(modeVal) {
    if (matchBelongsToMode({ mode: modeVal }, "BR Match")) {
      return {
        modeId: "BR Match",
        label: "BR Match",
        count: 5,
        presets: [500, 250, 150, 60, 40]
      };
    }
    if (matchBelongsToMode({ mode: modeVal }, "BR Survival")) {
      return {
        modeId: "BR Survival",
        label: "BR Survival",
        count: 10,
        presets: [500, 300, 200, 140, 100, 80, 60, 50, 40, 30]
      };
    }
    return null;
  }

  function defaultPrizeRankLabel(idx) {
    if (idx === 0) return "Winner (1st Position)";
    if (idx === 1) return "2nd Position";
    if (idx === 2) return "3rd Position";
    return (idx + 1) + "th Position";
  }

  function createDefaultFiveTierRows(presetAmounts) {
    var amounts = Array.isArray(presetAmounts) ? presetAmounts : [500, 250, 150, 60, 40];
    return [0, 1, 2, 3, 4].map(function(i) {
      return { rank: defaultPrizeRankLabel(i), amount: Number(amounts[i] || 0) };
    });
  }

  function buildFixedDraftRows(fixedCfg, sourcePrizes, usePresetsWhenMissing) {
    var src = Array.isArray(sourcePrizes) ? sourcePrizes : [];
    var rows = [];
    for (var i = 0; i < fixedCfg.count; i++) {
      var amt = src[i] !== undefined
        ? Math.max(0, Number(src[i].amount || 0))
        : (usePresetsWhenMissing ? Number(fixedCfg.presets[i] || 0) : 0);
      rows.push({ rank: fixedRankLabel(i), amount: amt });
    }
    return rows;
  }

  function getPrizeDraftList(ctxKey, matchObj, modeId) {
    if (!ui.prizeDrafts) ui.prizeDrafts = {};
    if (!ui.prizeDraftMode) ui.prizeDraftMode = {};
    var activeMode = modeId || ui.prizeDraftMode[ctxKey] || (matchObj && matchObj.mode) || "BR Match";
    ui.prizeDraftMode[ctxKey] = activeMode;
    var fixedCfg = getFixedPrizeModeConfig(activeMode);

    if (!Array.isArray(ui.prizeDrafts[ctxKey])) {
      if (fixedCfg) {
        var usePresets = (ctxKey === "create") && !(matchObj && Array.isArray(matchObj.prizes) && matchObj.prizes.length > 0);
        ui.prizeDrafts[ctxKey] = buildFixedDraftRows(fixedCfg, matchObj && matchObj.prizes, usePresets);
      } else if (matchObj && Array.isArray(matchObj.prizes) && matchObj.prizes.length > 0) {
        ui.prizeDrafts[ctxKey] = matchObj.prizes.map(function(p) {
          return { rank: String(p.rank || ""), amount: Number(p.amount || 0) };
        });
      } else if (ctxKey === "create") {
        ui.prizeDrafts[ctxKey] = createDefaultFiveTierRows([500, 250, 150, 60, 40]);
      } else {
        ui.prizeDrafts[ctxKey] = createDefaultFiveTierRows([0, 0, 0, 0, 0]);
      }
    } else if (fixedCfg && ui.prizeDrafts[ctxKey].length !== fixedCfg.count) {
      ui.prizeDrafts[ctxKey] = buildFixedDraftRows(fixedCfg, ui.prizeDrafts[ctxKey], ctxKey === "create");
    }
    return ui.prizeDrafts[ctxKey];
  }

  function syncPrizeDraftFromDom(ctxKey) {
    var list = getPrizeDraftList(ctxKey);
    list.forEach(function(item, idx) {
      var rEl = document.getElementById("pdRank_" + ctxKey + "_" + idx);
      var aEl = document.getElementById("pdAmt_" + ctxKey + "_" + idx);
      if (rEl) item.rank = rEl.value;
      if (aEl) item.amount = Number(aEl.value || 0);
    });
    return list;
  }

  function renderPrizeRowsHtml(ctxKey, totalInputId, modeId) {
    var activeMode = modeId || (ui.prizeDraftMode && ui.prizeDraftMode[ctxKey]) || "";
    var fixedCfg = getFixedPrizeModeConfig(activeMode);
    var list = getPrizeDraftList(ctxKey, null, activeMode);
    if (fixedCfg) {
      var badges = ["&#127942;", "&#129352;", "&#129353;"];
      return list.map(function(pr, idx) {
        var icon = badges[idx] || "&#127941;";
        var posLabel = fixedRankLabel(idx);
        return '<div class="prize-editor-row fixed-mode">' +
          '<div class="prize-fixed-pos">' +
            '<span aria-hidden="true">' + icon + '</span>' +
            '<span>' + escapeHtml(posLabel) + '</span>' +
          '</div>' +
          '<input id="pdAmt_' + ctxKey + '_' + idx + '" class="field-input" style="min-height:44px;font-size:14px;font-weight:800;" type="number" min="0" value="' + Math.max(0, Number(pr.amount || 0)) + '" placeholder="0" aria-label="' + escapeHtml(posLabel) + ' reward amount" oninput="syncPrizeDraftField(\'' + ctxKey + '\',' + idx + ',\'amount\',this.value)" />' +
        '</div>';

    if (list.length === 0) {
      return '<div style="font-size:12px;color:var(--text-3);padding:6px 0 8px;">No prize positions added. Tap + Add Position below.</div>';
    }
    return list.map(function(pr, idx) {
      return '<div class="prize-editor-row">' +
        '<input id="pdRank_' + ctxKey + '_' + idx + '" class="field-input" style="min-height:44px;font-size:13.5px;" type="text" dir="auto" value="' + escapeHtml(pr.rank) + '" placeholder="' + escapeHtml(defaultPrizeRankLabel(idx)) + '" oninput="syncPrizeDraftField(\'' + ctxKey + '\',' + idx + ',\'rank\',this.value)" />' +
        '<input id="pdAmt_' + ctxKey + '_' + idx + '" class="field-input" style="min-height:44px;font-size:14px;font-weight:800;" type="number" min="0" value="' + Number(pr.amount || 0) + '" placeholder="0" oninput="syncPrizeDraftField(\'' + ctxKey + '\',' + idx + ',\'amount\',this.value)" />' +
        '<button type="button" class="prize-row-del-btn" aria-label="Remove prize position" onclick="removePrizeDraftRow(\'' + ctxKey + '\',' + idx + ',\'' + escapeHtml(totalInputId) + '\')">&#10005;</button>' +
      '</div>';
    }).join("");
  }

  function renderPrizePoolSettingsInner(ctxKey, totalInputId, modeId) {
    var activeMode = modeId || (ui.prizeDraftMode && ui.prizeDraftMode[ctxKey]) || "";
    var fixedCfg = getFixedPrizeModeConfig(activeMode);

    return '<div id="prizePoolBox_' + ctxKey + '">' + renderPrizePoolSettingsInner(ctxKey, totalInputId, modeId) + '</div>';
